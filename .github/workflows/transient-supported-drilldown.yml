name: Transient Supported Drilldown

on:
  push:
    branches:
      - test/transient-supported-drilldown

permissions:
  actions: read
  contents: read

jobs:
  drilldown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect supported transient mechanisms
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import os

          from benchmark_mode import collect_repository_samples, summarize_benchmark
          from ci_retry_gate import GitHubAPI

          repos = [
              "pallets/flask","psf/requests","pytest-dev/pytest","axios/axios","pnpm/pnpm",
              "docker/compose","golangci/golangci-lint","astral-sh/ruff","serde-rs/serde",
              "hashicorp/terraform","django/django","fastapi/fastapi","encode/httpx",
              "tiangolo/sqlmodel","numpy/numpy","pandas-dev/pandas","pydantic/pydantic",
              "nodejs/node","denoland/deno","vitejs/vite","vercel/next.js","microsoft/TypeScript",
              "rust-lang/cargo","tokio-rs/tokio","BurntSushi/ripgrep","kubernetes/kubernetes",
              "helm/helm","prometheus/prometheus","grafana/grafana","hashicorp/vault"
          ]
          token = os.environ["INPUT_GITHUB_TOKEN"]

          def collect(repo):
              api = GitHubAPI(token)
              try:
                  natural, enriched = collect_repository_samples(api, repo, 5, 20, 150)
                  return repo, natural, enriched, None
              except RuntimeError as exc:
                  return repo, None, None, str(exc)[:240]

          histories, rerun_histories, skipped = {}, {}, []
          with ThreadPoolExecutor(max_workers=5) as pool:
              futures = [pool.submit(collect, repo) for repo in repos]
              for future in as_completed(futures):
                  repo, natural, enriched, error = future.result()
                  if error:
                      skipped.append((repo, error))
                  else:
                      histories[repo] = natural
                      rerun_histories[repo] = enriched

          summary = summarize_benchmark(
              histories,
              rerun_histories=rerun_histories,
              repositories_requested=len(repos),
              skipped=tuple(sorted(skipped)),
          )
          unknown = summary.unknown_intelligence

          print("=== TRANSIENT SUPPORTED DRILLDOWN ===")
          print(f"repositories_analyzed={summary.repositories_analyzed}")
          print(f"repositories_skipped={summary.repositories_skipped}")

          supported = [
              item for item in unknown.patterns
              if item.mechanism_status == "TRANSIENT_MECHANISM_SUPPORTED"
          ]
          print(f"supported_patterns={len(supported)}")

          for item in supported:
              blockers = ",".join(item.promotion_blockers)
              print(
                  f"supported_pattern={item.pattern_id} occurrences={item.occurrences} "
                  f"repositories={item.repositories} gt_reruns={item.rerun_observations} "
                  f"recoveries={item.recoveries} failed_again={item.failed_again} "
                  f"recovery_rate={item.recovery_rate:.4f} side_effects={item.side_effect_occurrences} "
                  f"distance={item.promotion_distance} primary_blocker={item.promotion_blocker} "
                  f"blockers={blockers!r} mechanism_reasons={item.mechanism_reasons!r} "
                  f"mechanism_causes={item.mechanism_causes!r} "
                  f"occurrence_deficit={item.occurrence_deficit} "
                  f"gt_rerun_deficit={item.gt_rerun_deficit} "
                  f"recovery_rate_deficit={item.recovery_rate_deficit:.4f} "
                  f"signature={item.signature!r}"
              )

          # Map each supported pattern back to repositories and run/job samples.
          supported_ids = {item.pattern_id for item in supported}
          from unknown_failure_intelligence import unknown_pattern_id
          for repo, (failures, _runs) in rerun_histories.items():
              for item in failures:
                  if item.category != "UNKNOWN":
                      continue
                  pid = unknown_pattern_id(item.signature or "unknown without stable evidence")
                  if pid in supported_ids:
                      print(
                          f"sample pattern={pid} repo={repo} run_id={item.run_id} "
                          f"job={item.job_name!r} recovery_status={item.recovery_status} "
                          f"side_effect={item.side_effect_risk} unknown_cause={item.unknown_cause!r}"
                      )
          PY
