name: Public Evidence Access Probe

on:
  pull_request:
    paths:
      - '.github/workflows/public-evidence-access-probe.yml'
      - 'docs/external-activation-gate-v1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      TARGET_REPOSITORY: Bernard-Ngu/GEOPHIRES-X
      TARGET_RUN_ID: '36012993291'
      TARGET_ATTEMPT: '2'
      TARGET_JOB_ID: '107760608854'
      TARGET_CHECK_RUN_ID: '107760608854'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Probe unauthenticated public GitHub evidence endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["TARGET_REPOSITORY"]
          run_id = os.environ["TARGET_RUN_ID"]
          attempt = os.environ["TARGET_ATTEMPT"]
          job_id = os.environ["TARGET_JOB_ID"]
          check_run_id = os.environ["TARGET_CHECK_RUN_ID"]

          endpoints = [
              ("repository", f"https://api.github.com/repos/{repo}"),
              ("run", f"https://api.github.com/repos/{repo}/actions/runs/{run_id}"),
              ("attempt-jobs", f"https://api.github.com/repos/{repo}/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100"),
              ("check-run", f"https://api.github.com/repos/{repo}/check-runs/{check_run_id}"),
              ("annotations", f"https://api.github.com/repos/{repo}/check-runs/{check_run_id}/annotations?per_page=100"),
              ("job-logs", f"https://api.github.com/repos/{repo}/actions/jobs/{job_id}/logs"),
          ]

          rows = []
          for name, url in endpoints:
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "ci-retry-gate-public-evidence-probe",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read(4096)
                      rows.append(
                          {
                              "endpoint": name,
                              "status": response.status,
                              "content_type": response.headers.get("Content-Type", ""),
                              "bytes_sampled": len(body),
                              "error": "",
                          }
                      )
              except urllib.error.HTTPError as exc:
                  body = exc.read(1000).decode("utf-8", errors="replace")
                  rows.append(
                      {
                          "endpoint": name,
                          "status": exc.code,
                          "content_type": exc.headers.get("Content-Type", ""),
                          "bytes_sampled": len(body.encode()),
                          "error": body[:300].replace("\n", " "),
                      }
                  )
              except Exception as exc:
                  rows.append(
                      {
                          "endpoint": name,
                          "status": 0,
                          "content_type": "",
                          "bytes_sampled": 0,
                          "error": f"{type(exc).__name__}: {exc}",
                      }
                  )

          print(json.dumps(rows, indent=2))

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as handle:
                  handle.write("## External Activation — Public Evidence Access Probe\n\n")
                  handle.write("No target token or secret was used.\n\n")
                  handle.write("| Endpoint | HTTP | Meaning |\n")
                  handle.write("|---|---:|---|\n")
                  for row in rows:
                      status = row["status"]
                      if 200 <= status < 300:
                          meaning = "publicly readable without target-repository credentials"
                      elif status in {401, 403, 404}:
                          meaning = "not publicly readable through this endpoint"
                      else:
                          meaning = "transport/API result requires inspection"
                      handle.write(f"| {row['endpoint']} | {status} | {meaning} |\n")

          required = {row["endpoint"]: row["status"] for row in rows}
          if required["repository"] != 200 or required["run"] != 200 or required["attempt-jobs"] != 200:
              raise SystemExit("basic public run metadata unexpectedly unavailable")
          PY

      - name: Exercise zero-install public annotation fallback
        env:
          INPUT_PUBLIC_READ_ONLY: 'true'
          INPUT_REPOSITORY: ${{ env.TARGET_REPOSITORY }}
          INPUT_RUN_ID: ${{ env.TARGET_RUN_ID }}
          INPUT_RUN_ATTEMPT: ${{ env.TARGET_ATTEMPT }}
          INPUT_AUTO_RERUN: 'false'
          INPUT_COMMENT_ON_PR: 'false'
          INPUT_MAX_ATTEMPTS: '2'
          CI_RETRY_GATE_REPORT_FILE: public-activation-report.md
          CI_RETRY_GATE_LOG_DIAGNOSTICS: 'true'
        run: |
          python3 ci_retry_gate.py
          test -s public-activation-report.md
          ! grep -q "requires a GitHub token" public-activation-report.md
          grep -q "Public check annotation" public-activation-report.md
