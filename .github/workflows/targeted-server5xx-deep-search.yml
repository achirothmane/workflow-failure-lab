name: Targeted SERVER 5XX Deep Search

on:
  push:
    branches:
      - test/targeted-server5xx-deep-search

permissions:
  actions: read
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search SERVER_5XX replication
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_REPOSITORY: othy19904-eng/workflow-failure-lab
          INPUT_BENCHMARK_REPOSITORIES: "pallets/flask,psf/requests,pytest-dev/pytest,axios/axios,pnpm/pnpm,docker/compose,golangci/golangci-lint,astral-sh/ruff,serde-rs/serde,hashicorp/terraform,django/django,fastapi/fastapi,encode/httpx,tiangolo/sqlmodel,numpy/numpy,pandas-dev/pandas,pydantic/pydantic,nodejs/node,denoland/deno,vitejs/vite,vercel/next.js,microsoft/TypeScript,rust-lang/cargo,tokio-rs/tokio,BurntSushi/ripgrep,kubernetes/kubernetes,helm/helm,prometheus/prometheus,grafana/grafana,hashicorp/vault"
          INPUT_BENCHMARK_RUNS: "1"
          INPUT_BENCHMARK_RERUN_RUNS: "50"
          INPUT_BENCHMARK_RERUN_SEARCH_RUNS: "500"
          INPUT_BENCHMARK_TARGET_MECHANISM: "SERVER_5XX"
        run: |
          python3 benchmark_mode.py
