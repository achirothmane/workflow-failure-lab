name: Selective Rerun E2E Gate

on:
  workflow_run:
    workflows: ["Selective Rerun E2E Fixture"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  gate:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: retry-gate
        uses: ./
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          auto-rerun: 'false'
          selective-rerun: 'true'
          max-attempts: '2'
          comment-on-pr: 'false'
          history-runs: '1'

      - name: Verify selective plan outputs
        shell: bash
        run: |
          echo "safe=${{ steps.retry-gate.outputs.selective-safe-jobs }}"
          echo "blocked=${{ steps.retry-gate.outputs.selective-blocked-jobs }}"
          echo "triggered=${{ steps.retry-gate.outputs.selective-reruns-triggered }}"
          test "${{ steps.retry-gate.outputs.selective-safe-jobs }}" = "1"
          test "${{ steps.retry-gate.outputs.selective-blocked-jobs }}" = "1"
          test "${{ steps.retry-gate.outputs.selective-reruns-triggered }}" = "1"
