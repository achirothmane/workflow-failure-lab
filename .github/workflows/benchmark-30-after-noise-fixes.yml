name: Benchmark 30 Repositories After Noise Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/benchmark-30-trigger.txt'

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run parallel 30-repository benchmark
        shell: bash
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import os

          from benchmark_mode import (
              collect_repository_samples,
              render_benchmark_report,
              summarize_benchmark,
          )
          from ci_retry_gate import GitHubAPI

          repos = [
              "pallets/flask","psf/requests","pytest-dev/pytest","axios/axios","pnpm/pnpm",
              "docker/compose","golangci/golangci-lint","astral-sh/ruff","serde-rs/serde",
              "hashicorp/terraform","django/django","fastapi/fastapi","encode/httpx",
              "tiangolo/sqlmodel","numpy/numpy","pandas-dev/pandas","pydantic/pydantic",
              "nodejs/node","denoland/deno","vitejs/vite","vercel/next.js","microsoft/TypeScript",
              "rust-lang/cargo","tokio-rs/tokio","BurntSushi/ripgrep","kubernetes/kubernetes",
              "helm/helm","prometheus/prometheus","grafana/grafana","hashicorp/vault"
          ]
          token = os.environ["INPUT_GITHUB_TOKEN"]

          def collect(repo):
              api = GitHubAPI(token)
              try:
                  natural, enriched = collect_repository_samples(
                      api, repo, 5, 20, 150
                  )
                  return repo, natural, enriched, None
              except RuntimeError as exc:
                  return repo, None, None, str(exc)[:240]

          histories = {}
          rerun_histories = {}
          skipped = []
          with ThreadPoolExecutor(max_workers=5) as pool:
              futures = [pool.submit(collect, repo) for repo in repos]
              for future in as_completed(futures):
                  repo, natural, enriched, error = future.result()
                  if error:
                      skipped.append((repo, error))
                  else:
                      histories[repo] = natural
                      rerun_histories[repo] = enriched

          summary = summarize_benchmark(
              histories,
              rerun_histories=rerun_histories,
              repositories_requested=len(repos),
              skipped=tuple(sorted(skipped)),
          )
          print(render_benchmark_report(summary), flush=True)
          print("=== MACHINE SUMMARY ===", flush=True)
          print(f"repositories_analyzed={summary.repositories_analyzed}", flush=True)
          print(f"repositories_skipped={summary.repositories_skipped}", flush=True)
          print(f"rerun_failed_jobs={summary.rerun_failed_jobs}", flush=True)
          print(f"rerun_candidates={summary.rerun_candidates}", flush=True)
          print(f"rerun_evaluated={summary.rerun_evaluated}", flush=True)
          print(f"rerun_recoveries={summary.rerun_recoveries}", flush=True)
          print(f"rerun_false_positives={summary.rerun_false_positives}", flush=True)
          for item in summary.rejections:
              print(
                  f"rejection={item.reason} blocked={item.blocked} "
                  f"recovered={item.recovered} failed_again={item.failed_again} "
                  f"unknown={item.unknown_outcomes}",
                  flush=True,
              )
          u = summary.unknown_intelligence
          print(f"unknown_failures={u.unknown_failures}", flush=True)
          print(f"unknown_patterns={len(u.patterns)}", flush=True)
          print(f"unknown_repeated={u.repeated_patterns}", flush=True)
          print(f"unknown_evaluated={u.evaluated_reruns}", flush=True)
          print(f"unknown_recoveries={u.recoveries}", flush=True)
          print(f"unknown_failed_again={u.failed_again}", flush=True)
          print(f"unknown_promotion_candidates={len(u.promotion_candidates)}", flush=True)
          print("unknown_promotion_ids=" + ",".join(x.pattern_id for x in u.promotion_candidates), flush=True)
          PY
