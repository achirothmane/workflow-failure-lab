name: 30-Repo Rejection Intelligence Benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/rejection-intelligence-30-trigger.txt'

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        uses: ./
        with:
          github-token: ${{ github.token }}
          auto-rerun: 'false'
          selective-rerun: 'false'
          policy-shadow-mode: 'false'
          history-runs: '0'
          comment-on-pr: 'false'
          benchmark-mode: 'true'
          benchmark-runs: '5'
          benchmark-rerun-runs: '20'
          benchmark-rerun-search-runs: '150'
          benchmark-repositories: |
            pallets/flask
            psf/requests
            pytest-dev/pytest
            axios/axios
            pnpm/pnpm
            docker/compose
            golangci/golangci-lint
            astral-sh/ruff
            serde-rs/serde
            hashicorp/terraform
            django/django
            fastapi/fastapi
            encode/httpx
            tiangolo/sqlmodel
            numpy/numpy
            pandas-dev/pandas
            pydantic/pydantic
            nodejs/node
            denoland/deno
            vitejs/vite
            vercel/next.js
            microsoft/TypeScript
            rust-lang/cargo
            tokio-rs/tokio
            BurntSushi/ripgrep
            kubernetes/kubernetes
            helm/helm
            prometheus/prometheus
            grafana/grafana
            hashicorp/vault
      - name: Show rejection intelligence outputs
        shell: bash
        run: |
          echo "repositories=${{ steps.gate.outputs.benchmark-repositories-analyzed }}"
          echo "rerun_failures=${{ steps.gate.outputs.benchmark-rerun-failed-jobs }}"
          echo "candidates=${{ steps.gate.outputs.benchmark-rerun-candidates }}"
          echo "candidate_recoveries=${{ steps.gate.outputs.benchmark-rerun-recoveries }}"
          echo "candidate_false_positives=${{ steps.gate.outputs.benchmark-rerun-false-positives }}"
          echo "blocked=${{ steps.gate.outputs.benchmark-rerun-blocked }}"
          echo "blocked_recovered=${{ steps.gate.outputs.benchmark-rerun-blocked-recovered }}"
          echo "blocked_failed_again=${{ steps.gate.outputs.benchmark-rerun-blocked-failed-again }}"
          echo "blocked_unknown=${{ steps.gate.outputs.benchmark-rerun-blocked-unknown }}"
          echo "side_effect=${{ steps.gate.outputs.benchmark-rejection-side-effect }}"
          echo "code_regression=${{ steps.gate.outputs.benchmark-rejection-code-regression }}"
          echo "low_conf_transient=${{ steps.gate.outputs.benchmark-rejection-low-confidence-transient }}"
          echo "unknown_classification=${{ steps.gate.outputs.benchmark-rejection-unknown-classification }}"
          echo "non_transient=${{ steps.gate.outputs.benchmark-rejection-non-transient }}"
          test "${{ steps.gate.outputs.benchmark-repositories-analyzed }}" -ge "20"
