name: Live External Monotonic Root Controller

on:
  workflow_run:
    workflows: ["Live External Monotonic Root Fixture"]
    types: [completed]

permissions:
  contents: write
  actions: write
  checks: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  EXTERNAL_ROOT_PREDICATE_TYPE: https://github.com/achirothmane/workflow-failure-lab/attestations/external-monotonic-root/v1
  EXTERNAL_ROOT_SIGNER_WORKFLOW: achirothmane/workflow-failure-lab/.github/workflows/live-external-monotonic-root-controller.yml

jobs:
  seed:
    name: Seed decision and local coordination records
    if: ${{ github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    outputs:
      coordination-ref: ${{ steps.meta.outputs.coordination-ref }}
      witness-ref: ${{ steps.meta.outputs.witness-ref }}
      base-sha: ${{ steps.meta.outputs.base-sha }}
      decision-sha: ${{ steps.gate.outputs.decision-record-sha256 }}
      plan-sha: ${{ steps.gate.outputs.effect-plan-sha256 }}
    steps:
      - uses: actions/checkout@v4

      - id: gate
        name: Build deferred admitted decision
        shell: bash
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_REPOSITORY: ${{ github.repository }}
          INPUT_AUTO_RERUN: 'true'
          INPUT_DEFER_EFFECT: 'true'
          INPUT_MAX_ATTEMPTS: '2'
          INPUT_COMMENT_ON_PR: 'false'
        run: python3 ci_retry_gate.py

      - name: Verify decision is admitted
        shell: bash
        env:
          DECISION: ${{ steps.gate.outputs.decision }}
          EVIDENCE_STATUS: ${{ steps.gate.outputs.evidence-status }}
          MUTATION_ADMITTED: ${{ steps.gate.outputs.mutation-admitted }}
        run: |
          test "$DECISION" = "ALLOW"
          test "$EVIDENCE_STATUS" = "SUFFICIENT"
          test "$MUTATION_ADMITTED" = "true"

      - name: Persist canonical DER
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gate.outputs.decision-record-artifact-name }}
          path: |
            ${{ steps.gate.outputs.decision-record-path }}
            ${{ steps.gate.outputs.effect-plan-path }}
          if-no-files-found: error

      - id: meta
        name: Bind local records to target run
        shell: bash
        run: |
          echo "coordination-ref=refs/heads/ci-retry-gate-external-root/${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          echo "witness-ref=refs/heads/ci-retry-gate-external-root-witness/${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          echo "base-sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Build durable deferred-effect bundle
        shell: bash
        env:
          DECISION_RECORD_PATH: ${{ steps.gate.outputs.decision-record-path }}
          EFFECT_PLAN_PATH: ${{ steps.gate.outputs.effect-plan-path }}
          EBA_REQUEST_PATH: ${{ steps.gate.outputs.eba-request-path }}
          EBA_ASSUMPTION_PATH: ${{ steps.gate.outputs.eba-assumption-path }}
          EBA_AUTHORITY_PATH: ${{ steps.gate.outputs.eba-authority-path }}
          EBA_DECISION_PATH: ${{ steps.gate.outputs.eba-decision-path }}
          DECISION_RECORD_SHA256: ${{ steps.gate.outputs.decision-record-sha256 }}
          EFFECT_PLAN_SHA256: ${{ steps.gate.outputs.effect-plan-sha256 }}
          EBA_REQUEST_SHA256: ${{ steps.gate.outputs.eba-request-sha256 }}
          EBA_ASSUMPTION_SHA256: ${{ steps.gate.outputs.eba-assumption-sha256 }}
          EBA_AUTHORITY_SHA256: ${{ steps.gate.outputs.eba-authority-sha256 }}
          EBA_DECISION_SHA256: ${{ steps.gate.outputs.eba-decision-sha256 }}
          DECISION_RECORD_ARTIFACT_NAME: ${{ steps.gate.outputs.decision-record-artifact-name }}
          DECISION_EXPERIENCE_JSON: ${{ steps.gate.outputs.decision-experience-json }}
        run: |
          mkdir -p "$RUNNER_TEMP/external-root-state"
          python3 e2e/takeover_bundle_manifest.py write             --output "$RUNNER_TEMP/external-root-state/manifest.json"             --bundle-dir "$RUNNER_TEMP/external-root-state/bundle"

      - name: Seed mutable coordination ref
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ steps.meta.outputs.coordination-ref }}"             seed             --base-sha "${{ steps.meta.outputs.base-sha }}"

      - name: Seed local witness ref
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ steps.meta.outputs.witness-ref }}"             seed             --base-sha "${{ steps.meta.outputs.base-sha }}"

      - name: Persist deferred-effect state
        uses: actions/upload-artifact@v4
        with:
          name: external-monotonic-root-state-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/external-root-state
          if-no-files-found: error

  establish-t2:
    name: Establish T2 and attest independent high-water mark
    needs: seed
    if: ${{ github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    outputs:
      token1: ${{ steps.t1.outputs.candidate-sha }}
      token2: ${{ steps.t2.outputs.candidate-sha }}
    steps:
      - uses: actions/checkout@v4

      - id: t1
        name: Prepare T1
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}"             prepare             --base-sha "${{ needs.seed.outputs.base-sha }}"             --owner external-root-t1             --epoch 1             --decision-sha "${{ needs.seed.outputs.decision-sha }}"             --plan-sha "${{ needs.seed.outputs.plan-sha }}"             --result "$RUNNER_TEMP/t1.json"

      - name: Publish T1 to coordination
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}"             publish             --base-sha "${{ needs.seed.outputs.base-sha }}"             --owner external-root-t1             --candidate-sha "${{ steps.t1.outputs.candidate-sha }}"             --result "$RUNNER_TEMP/t1-coord.json"

      - name: Publish T1 to local witness
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.witness-ref }}"             publish             --base-sha "${{ needs.seed.outputs.base-sha }}"             --owner external-root-t1-witness             --candidate-sha "${{ steps.t1.outputs.candidate-sha }}"             --result "$RUNNER_TEMP/t1-witness.json"

      - id: t2
        name: Prepare T2 as child of T1
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}"             prepare             --base-sha "${{ steps.t1.outputs.candidate-sha }}"             --owner external-root-t2             --epoch 2             --decision-sha "${{ needs.seed.outputs.decision-sha }}"             --plan-sha "${{ needs.seed.outputs.plan-sha }}"             --result "$RUNNER_TEMP/t2.json"

      - name: Advance coordination to T2
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}"             publish             --base-sha "${{ steps.t1.outputs.candidate-sha }}"             --owner external-root-t2             --candidate-sha "${{ steps.t2.outputs.candidate-sha }}"             --result "$RUNNER_TEMP/t2-coord.json"

      - name: Advance local witness to T2
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.witness-ref }}"             publish             --base-sha "${{ steps.t1.outputs.candidate-sha }}"             --owner external-root-t2-witness             --candidate-sha "${{ steps.t2.outputs.candidate-sha }}"             --result "$RUNNER_TEMP/t2-witness.json"

      - id: root
        name: Build T2 external root record
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/root-t2"
          python3 e2e/external_monotonic_root_cli.py build             --repository "${{ github.repository }}"             --run-id "${{ github.event.workflow_run.id }}"             --epoch 2             --token "${{ steps.t2.outputs.candidate-sha }}"             --decision-sha "${{ needs.seed.outputs.decision-sha }}"             --plan-sha "${{ needs.seed.outputs.plan-sha }}"             --state EXECUTABLE             --record "$RUNNER_TEMP/root-t2/root-record.json"             --anchor "$RUNNER_TEMP/root-t2/root-anchor.json"             --predicate "$RUNNER_TEMP/root-t2/predicate.json"

      - id: attest
        name: Attest T2 root into Sigstore transparency log
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.root.outputs.root-anchor-path }}
          predicate-type: ${{ env.EXTERNAL_ROOT_PREDICATE_TYPE }}
          predicate-path: ${{ steps.root.outputs.root-predicate-path }}

      - name: Normalize attestation bundle path
        shell: bash
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "$RUNNER_TEMP/root-t2/attestation-bundle.json"

      - name: Persist externally attested T2 root proof
        uses: actions/upload-artifact@v4
        with:
          name: external-monotonic-root-t2-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/root-t2
          if-no-files-found: error

  compromise-both:
    name: Compromise both local records back to T1
    needs: [seed, establish-t2]
    if: ${{ github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete mutable coordination and local witness
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}" delete
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.witness-ref }}" delete

      - name: Recreate both local records at superseded T1
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}"             seed             --base-sha "${{ needs.establish-t2.outputs.token1 }}"
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.witness-ref }}"             seed             --base-sha "${{ needs.establish-t2.outputs.token1 }}"

      - id: coord
        name: Read compromised coordination
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}" read

      - id: witness
        name: Read compromised local witness
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.witness-ref }}" read

      - name: Prove both local records were resurrected
        shell: bash
        env:
          COORD: ${{ steps.coord.outputs.coordination-sha }}
          WITNESS: ${{ steps.witness.outputs.coordination-sha }}
        run: |
          test "$COORD" = "${{ needs.establish-t2.outputs.token1 }}"
          test "$WITNESS" = "${{ needs.establish-t2.outputs.token1 }}"
          test "$COORD" != "${{ needs.establish-t2.outputs.token2 }}"

  stale-t1:
    name: External root fences T1 despite double local compromise
    needs: [seed, establish-t2, compromise-both]
    if: ${{ github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: external-monotonic-root-state-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/external-root-state

      - uses: actions/download-artifact@v4
        with:
          name: external-monotonic-root-t2-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/root-t2

      - name: Restore deferred-effect manifest
        shell: bash
        run: |
          python3 e2e/takeover_bundle_manifest.py export             --manifest "$RUNNER_TEMP/external-root-state/manifest.json"             --bundle-dir "$RUNNER_TEMP/external-root-state/bundle"

      - id: stale
        name: Present locally resurrected T1 at Effect boundary
        shell: bash
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_EFFECT_PLAN_PATH: ${{ env.TAKEOVER_EFFECT_PLAN_PATH }}
          INPUT_EFFECT_PLAN_SHA256: ${{ env.TAKEOVER_EFFECT_PLAN_SHA256 }}
          INPUT_DECISION_RECORD_PATH: ${{ env.TAKEOVER_DECISION_RECORD_PATH }}
          INPUT_DECISION_RECORD_SHA256: ${{ env.TAKEOVER_DECISION_RECORD_SHA256 }}
          INPUT_EBA_REQUEST_PATH: ${{ env.TAKEOVER_EBA_REQUEST_PATH }}
          INPUT_EBA_REQUEST_SHA256: ${{ env.TAKEOVER_EBA_REQUEST_SHA256 }}
          INPUT_EBA_ASSUMPTION_PATH: ${{ env.TAKEOVER_EBA_ASSUMPTION_PATH }}
          INPUT_EBA_ASSUMPTION_SHA256: ${{ env.TAKEOVER_EBA_ASSUMPTION_SHA256 }}
          INPUT_EBA_AUTHORITY_PATH: ${{ env.TAKEOVER_EBA_AUTHORITY_PATH }}
          INPUT_EBA_AUTHORITY_SHA256: ${{ env.TAKEOVER_EBA_AUTHORITY_SHA256 }}
          INPUT_EBA_DECISION_PATH: ${{ env.TAKEOVER_EBA_DECISION_PATH }}
          INPUT_EBA_DECISION_SHA256: ${{ env.TAKEOVER_EBA_DECISION_SHA256 }}
          INPUT_EBA_RECEIPT_PATH: ${{ runner.temp }}/external-root-stale-t1.eba-receipt.json
          INPUT_DECISION_EXPERIENCE_JSON: ${{ env.TAKEOVER_DECISION_EXPERIENCE_JSON }}
          INPUT_LINEARIZABLE_COORDINATION_REF: ${{ needs.seed.outputs.coordination-ref }}
          INPUT_LINEARIZABLE_WITNESS_REF: ${{ needs.seed.outputs.witness-ref }}
          INPUT_LINEARIZABLE_FENCING_TOKEN_SHA: ${{ needs.establish-t2.outputs.token1 }}
          INPUT_EXTERNAL_MONOTONIC_ROOT_RECORD_PATH: ${{ runner.temp }}/root-t2/root-record.json
          INPUT_EXTERNAL_MONOTONIC_ROOT_ANCHOR_PATH: ${{ runner.temp }}/root-t2/root-anchor.json
          INPUT_EXTERNAL_MONOTONIC_ROOT_BUNDLE_PATH: ${{ runner.temp }}/root-t2/attestation-bundle.json
          INPUT_EXTERNAL_MONOTONIC_ROOT_SIGNER_WORKFLOW: ${{ env.EXTERNAL_ROOT_SIGNER_WORKFLOW }}
          INPUT_EXTERNAL_MONOTONIC_ROOT_PREDICATE_TYPE: ${{ env.EXTERNAL_ROOT_PREDICATE_TYPE }}
        run: python3 effect_executor.py

      - name: Verify independent root defeated double-local resurrection
        shell: bash
        env:
          OUTCOME: ${{ steps.stale.outputs.effect-outcome }}
          TRIGGERED: ${{ steps.stale.outputs.rerun-triggered }}
          REASON: ${{ steps.stale.outputs.effect-reason }}
        run: |
          test "$OUTCOME" = "NOT_EXECUTED"
          test "$TRIGGERED" = "false"
          case "$REASON" in
            "EXTERNAL_MONOTONIC_ROOT_BLOCK: TOKEN_BELOW_EXTERNAL_MONOTONIC_ROOT:"*) ;;
            *) echo "::error::external root did not fence T1: $REASON"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: external-monotonic-root-stale-t1-proof-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/external-root-stale-t1.eba-receipt.json
          if-no-files-found: error

  recover-close:
    name: Recover from T2, execute T3, and externally close at T4
    needs: [seed, establish-t2, stale-t1]
    if: ${{ github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    outputs:
      token3: ${{ steps.t3.outputs.candidate-sha }}
      token4: ${{ steps.t4.outputs.candidate-sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: external-monotonic-root-state-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/external-root-state

      - uses: actions/download-artifact@v4
        with:
          name: external-monotonic-root-t2-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/root-t2

      - name: Restore deferred-effect manifest
        shell: bash
        run: |
          python3 e2e/takeover_bundle_manifest.py export             --manifest "$RUNNER_TEMP/external-root-state/manifest.json"             --bundle-dir "$RUNNER_TEMP/external-root-state/bundle"

      - id: t3
        name: Prepare T3 from externally witnessed T2 lineage
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}"             prepare             --base-sha "${{ needs.establish-t2.outputs.token2 }}"             --owner external-root-t3             --epoch 3             --decision-sha "${{ needs.seed.outputs.decision-sha }}"             --plan-sha "${{ needs.seed.outputs.plan-sha }}"             --result "$RUNNER_TEMP/t3.json"

      - name: Fast-forward compromised coordination to T3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}"             publish             --base-sha "${{ needs.establish-t2.outputs.token1 }}"             --owner external-root-t3             --candidate-sha "${{ steps.t3.outputs.candidate-sha }}"             --result "$RUNNER_TEMP/t3-coord.json"

      - name: Fast-forward compromised local witness to T3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.witness-ref }}"             publish             --base-sha "${{ needs.establish-t2.outputs.token1 }}"             --owner external-root-t3-witness             --candidate-sha "${{ steps.t3.outputs.candidate-sha }}"             --result "$RUNNER_TEMP/t3-witness.json"

      - id: effect
        name: Execute T3 only because it descends from external T2 root
        shell: bash
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_EFFECT_PLAN_PATH: ${{ env.TAKEOVER_EFFECT_PLAN_PATH }}
          INPUT_EFFECT_PLAN_SHA256: ${{ env.TAKEOVER_EFFECT_PLAN_SHA256 }}
          INPUT_DECISION_RECORD_PATH: ${{ env.TAKEOVER_DECISION_RECORD_PATH }}
          INPUT_DECISION_RECORD_SHA256: ${{ env.TAKEOVER_DECISION_RECORD_SHA256 }}
          INPUT_EBA_REQUEST_PATH: ${{ env.TAKEOVER_EBA_REQUEST_PATH }}
          INPUT_EBA_REQUEST_SHA256: ${{ env.TAKEOVER_EBA_REQUEST_SHA256 }}
          INPUT_EBA_ASSUMPTION_PATH: ${{ env.TAKEOVER_EBA_ASSUMPTION_PATH }}
          INPUT_EBA_ASSUMPTION_SHA256: ${{ env.TAKEOVER_EBA_ASSUMPTION_SHA256 }}
          INPUT_EBA_AUTHORITY_PATH: ${{ env.TAKEOVER_EBA_AUTHORITY_PATH }}
          INPUT_EBA_AUTHORITY_SHA256: ${{ env.TAKEOVER_EBA_AUTHORITY_SHA256 }}
          INPUT_EBA_DECISION_PATH: ${{ env.TAKEOVER_EBA_DECISION_PATH }}
          INPUT_EBA_DECISION_SHA256: ${{ env.TAKEOVER_EBA_DECISION_SHA256 }}
          INPUT_EBA_RECEIPT_PATH: ${{ runner.temp }}/external-root-t3.eba-receipt.json
          INPUT_DECISION_EXPERIENCE_JSON: ${{ env.TAKEOVER_DECISION_EXPERIENCE_JSON }}
          INPUT_LINEARIZABLE_COORDINATION_REF: ${{ needs.seed.outputs.coordination-ref }}
          INPUT_LINEARIZABLE_WITNESS_REF: ${{ needs.seed.outputs.witness-ref }}
          INPUT_LINEARIZABLE_FENCING_TOKEN_SHA: ${{ steps.t3.outputs.candidate-sha }}
          INPUT_EXTERNAL_MONOTONIC_ROOT_RECORD_PATH: ${{ runner.temp }}/root-t2/root-record.json
          INPUT_EXTERNAL_MONOTONIC_ROOT_ANCHOR_PATH: ${{ runner.temp }}/root-t2/root-anchor.json
          INPUT_EXTERNAL_MONOTONIC_ROOT_BUNDLE_PATH: ${{ runner.temp }}/root-t2/attestation-bundle.json
          INPUT_EXTERNAL_MONOTONIC_ROOT_SIGNER_WORKFLOW: ${{ env.EXTERNAL_ROOT_SIGNER_WORKFLOW }}
          INPUT_EXTERNAL_MONOTONIC_ROOT_PREDICATE_TYPE: ${{ env.EXTERNAL_ROOT_PREDICATE_TYPE }}
        run: python3 effect_executor.py

      - name: Verify descendant T3 executed exactly once
        shell: bash
        env:
          OUTCOME: ${{ steps.effect.outputs.effect-outcome }}
          TRIGGERED: ${{ steps.effect.outputs.rerun-triggered }}
          ROOT_EPOCH: ${{ steps.effect.outputs.external-monotonic-root-epoch }}
        run: |
          test "$OUTCOME" = "SUCCEEDED"
          test "$TRIGGERED" = "true"
          test "$ROOT_EPOCH" = "2"

      - name: Persist authoritative T3 receipt
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TAKEOVER_DECISION_RECORD_ARTIFACT_NAME }}-receipt
          path: ${{ runner.temp }}/external-root-t3.eba-receipt.json
          if-no-files-found: error

      - id: t4
        name: Prepare CLOSED T4 tombstone
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}"             prepare-tombstone             --base-sha "${{ steps.t3.outputs.candidate-sha }}"             --decision-sha "${{ needs.seed.outputs.decision-sha }}"             --plan-sha "${{ needs.seed.outputs.plan-sha }}"             --reason "effect-dispatched-awaiting-reconciliation"             --result "$RUNNER_TEMP/t4.json"

      - name: Advance coordination to CLOSED T4
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}"             publish             --base-sha "${{ steps.t3.outputs.candidate-sha }}"             --owner external-root-closer             --candidate-sha "${{ steps.t4.outputs.candidate-sha }}"             --result "$RUNNER_TEMP/t4-coord.json"

      - name: Advance local witness to CLOSED T4
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.witness-ref }}"             publish             --base-sha "${{ steps.t3.outputs.candidate-sha }}"             --owner external-root-closer-witness             --candidate-sha "${{ steps.t4.outputs.candidate-sha }}"             --result "$RUNNER_TEMP/t4-witness.json"

      - id: closed-root
        name: Build CLOSED T4 external root record
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/root-t4"
          python3 e2e/external_monotonic_root_cli.py build             --repository "${{ github.repository }}"             --run-id "${{ github.event.workflow_run.id }}"             --epoch 4             --token "${{ steps.t4.outputs.candidate-sha }}"             --decision-sha "${{ needs.seed.outputs.decision-sha }}"             --plan-sha "${{ needs.seed.outputs.plan-sha }}"             --state CLOSED             --record "$RUNNER_TEMP/root-t4/root-record.json"             --anchor "$RUNNER_TEMP/root-t4/root-anchor.json"             --predicate "$RUNNER_TEMP/root-t4/predicate.json"

      - id: attest-closed
        name: Attest CLOSED T4 high-water mark into Sigstore
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.closed-root.outputs.root-anchor-path }}
          predicate-type: ${{ env.EXTERNAL_ROOT_PREDICATE_TYPE }}
          predicate-path: ${{ steps.closed-root.outputs.root-predicate-path }}

      - name: Normalize CLOSED attestation bundle
        shell: bash
        run: |
          cp "${{ steps.attest-closed.outputs.bundle-path }}" "$RUNNER_TEMP/root-t4/attestation-bundle.json"

      - name: Persist externally attested CLOSED T4 root
        uses: actions/upload-artifact@v4
        with:
          name: external-monotonic-root-t4-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/root-t4
          if-no-files-found: error

  compromise-after-close:
    name: Compromise both local records back to executable T3
    needs: [seed, recover-close]
    if: ${{ github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete both CLOSED local records
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}" delete
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.witness-ref }}" delete

      - name: Recreate both local records at old executable T3
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}"             seed --base-sha "${{ needs.recover-close.outputs.token3 }}"
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.witness-ref }}"             seed --base-sha "${{ needs.recover-close.outputs.token3 }}"

  stale-t3:
    name: CLOSED external root prevents T3 resurrection
    needs: [seed, recover-close, compromise-after-close]
    if: ${{ github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: external-monotonic-root-state-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/external-root-state

      - uses: actions/download-artifact@v4
        with:
          name: external-monotonic-root-t4-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/root-t4

      - name: Restore deferred-effect manifest
        shell: bash
        run: |
          python3 e2e/takeover_bundle_manifest.py export             --manifest "$RUNNER_TEMP/external-root-state/manifest.json"             --bundle-dir "$RUNNER_TEMP/external-root-state/bundle"

      - id: stale
        name: Present resurrected executable T3 below CLOSED T4 root
        shell: bash
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_EFFECT_PLAN_PATH: ${{ env.TAKEOVER_EFFECT_PLAN_PATH }}
          INPUT_EFFECT_PLAN_SHA256: ${{ env.TAKEOVER_EFFECT_PLAN_SHA256 }}
          INPUT_DECISION_RECORD_PATH: ${{ env.TAKEOVER_DECISION_RECORD_PATH }}
          INPUT_DECISION_RECORD_SHA256: ${{ env.TAKEOVER_DECISION_RECORD_SHA256 }}
          INPUT_EBA_REQUEST_PATH: ${{ env.TAKEOVER_EBA_REQUEST_PATH }}
          INPUT_EBA_REQUEST_SHA256: ${{ env.TAKEOVER_EBA_REQUEST_SHA256 }}
          INPUT_EBA_ASSUMPTION_PATH: ${{ env.TAKEOVER_EBA_ASSUMPTION_PATH }}
          INPUT_EBA_ASSUMPTION_SHA256: ${{ env.TAKEOVER_EBA_ASSUMPTION_SHA256 }}
          INPUT_EBA_AUTHORITY_PATH: ${{ env.TAKEOVER_EBA_AUTHORITY_PATH }}
          INPUT_EBA_AUTHORITY_SHA256: ${{ env.TAKEOVER_EBA_AUTHORITY_SHA256 }}
          INPUT_EBA_DECISION_PATH: ${{ env.TAKEOVER_EBA_DECISION_PATH }}
          INPUT_EBA_DECISION_SHA256: ${{ env.TAKEOVER_EBA_DECISION_SHA256 }}
          INPUT_EBA_RECEIPT_PATH: ${{ runner.temp }}/external-root-stale-t3.eba-receipt.json
          INPUT_DECISION_EXPERIENCE_JSON: ${{ env.TAKEOVER_DECISION_EXPERIENCE_JSON }}
          INPUT_LINEARIZABLE_COORDINATION_REF: ${{ needs.seed.outputs.coordination-ref }}
          INPUT_LINEARIZABLE_WITNESS_REF: ${{ needs.seed.outputs.witness-ref }}
          INPUT_LINEARIZABLE_FENCING_TOKEN_SHA: ${{ needs.recover-close.outputs.token3 }}
          INPUT_EXTERNAL_MONOTONIC_ROOT_RECORD_PATH: ${{ runner.temp }}/root-t4/root-record.json
          INPUT_EXTERNAL_MONOTONIC_ROOT_ANCHOR_PATH: ${{ runner.temp }}/root-t4/root-anchor.json
          INPUT_EXTERNAL_MONOTONIC_ROOT_BUNDLE_PATH: ${{ runner.temp }}/root-t4/attestation-bundle.json
          INPUT_EXTERNAL_MONOTONIC_ROOT_SIGNER_WORKFLOW: ${{ env.EXTERNAL_ROOT_SIGNER_WORKFLOW }}
          INPUT_EXTERNAL_MONOTONIC_ROOT_PREDICATE_TYPE: ${{ env.EXTERNAL_ROOT_PREDICATE_TYPE }}
        run: python3 effect_executor.py

      - name: Verify CLOSED external root is the irreversible floor
        shell: bash
        env:
          OUTCOME: ${{ steps.stale.outputs.effect-outcome }}
          TRIGGERED: ${{ steps.stale.outputs.rerun-triggered }}
          REASON: ${{ steps.stale.outputs.effect-reason }}
        run: |
          test "$OUTCOME" = "NOT_EXECUTED"
          test "$TRIGGERED" = "false"
          case "$REASON" in
            "EXTERNAL_MONOTONIC_ROOT_BLOCK: TOKEN_BELOW_EXTERNAL_MONOTONIC_ROOT:"*) ;;
            *) echo "::error::CLOSED root did not fence T3: $REASON"; exit 1 ;;
          esac

      - name: Restore local records to CLOSED T4
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}"             publish             --base-sha "${{ needs.recover-close.outputs.token3 }}"             --owner restore-closed-t4             --candidate-sha "${{ needs.recover-close.outputs.token4 }}"             --result "$RUNNER_TEMP/restore-coord.json"
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.witness-ref }}"             publish             --base-sha "${{ needs.recover-close.outputs.token3 }}"             --owner restore-closed-t4-witness             --candidate-sha "${{ needs.recover-close.outputs.token4 }}"             --result "$RUNNER_TEMP/restore-witness.json"

      - uses: actions/upload-artifact@v4
        with:
          name: external-monotonic-root-stale-t3-proof-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/external-root-stale-t3.eba-receipt.json
          if-no-files-found: error

  stale-signed-root-replay:
    name: Old signed T2 root cannot override CLOSED T4
    needs: [seed, establish-t2, recover-close, stale-t3]
    if: ${{ github.event.workflow_run.run_attempt == 1 }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: external-monotonic-root-state-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/external-root-state

      - uses: actions/download-artifact@v4
        with:
          name: external-monotonic-root-t2-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/root-t2

      - name: Restore deferred-effect manifest
        shell: bash
        run: |
          python3 e2e/takeover_bundle_manifest.py export             --manifest "$RUNNER_TEMP/external-root-state/manifest.json"             --bundle-dir "$RUNNER_TEMP/external-root-state/bundle"

      - name: Rewind both local records from CLOSED T4 to old executable T2
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}" delete
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.witness-ref }}" delete
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}"             seed --base-sha "${{ needs.establish-t2.outputs.token2 }}"
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.witness-ref }}"             seed --base-sha "${{ needs.establish-t2.outputs.token2 }}"

      - id: stale-root
        name: Replay authentic old T2 root and bundle at Effect boundary
        shell: bash
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_EFFECT_PLAN_PATH: ${{ env.TAKEOVER_EFFECT_PLAN_PATH }}
          INPUT_EFFECT_PLAN_SHA256: ${{ env.TAKEOVER_EFFECT_PLAN_SHA256 }}
          INPUT_DECISION_RECORD_PATH: ${{ env.TAKEOVER_DECISION_RECORD_PATH }}
          INPUT_DECISION_RECORD_SHA256: ${{ env.TAKEOVER_DECISION_RECORD_SHA256 }}
          INPUT_EBA_REQUEST_PATH: ${{ env.TAKEOVER_EBA_REQUEST_PATH }}
          INPUT_EBA_REQUEST_SHA256: ${{ env.TAKEOVER_EBA_REQUEST_SHA256 }}
          INPUT_EBA_ASSUMPTION_PATH: ${{ env.TAKEOVER_EBA_ASSUMPTION_PATH }}
          INPUT_EBA_ASSUMPTION_SHA256: ${{ env.TAKEOVER_EBA_ASSUMPTION_SHA256 }}
          INPUT_EBA_AUTHORITY_PATH: ${{ env.TAKEOVER_EBA_AUTHORITY_PATH }}
          INPUT_EBA_AUTHORITY_SHA256: ${{ env.TAKEOVER_EBA_AUTHORITY_SHA256 }}
          INPUT_EBA_DECISION_PATH: ${{ env.TAKEOVER_EBA_DECISION_PATH }}
          INPUT_EBA_DECISION_SHA256: ${{ env.TAKEOVER_EBA_DECISION_SHA256 }}
          INPUT_EBA_RECEIPT_PATH: ${{ runner.temp }}/stale-signed-root-replay.eba-receipt.json
          INPUT_DECISION_EXPERIENCE_JSON: ${{ env.TAKEOVER_DECISION_EXPERIENCE_JSON }}
          INPUT_LINEARIZABLE_COORDINATION_REF: ${{ needs.seed.outputs.coordination-ref }}
          INPUT_LINEARIZABLE_WITNESS_REF: ${{ needs.seed.outputs.witness-ref }}
          INPUT_LINEARIZABLE_FENCING_TOKEN_SHA: ${{ needs.establish-t2.outputs.token2 }}
          INPUT_EXTERNAL_MONOTONIC_ROOT_RECORD_PATH: ${{ runner.temp }}/root-t2/root-record.json
          INPUT_EXTERNAL_MONOTONIC_ROOT_ANCHOR_PATH: ${{ runner.temp }}/root-t2/root-anchor.json
          INPUT_EXTERNAL_MONOTONIC_ROOT_BUNDLE_PATH: ${{ runner.temp }}/root-t2/attestation-bundle.json
          INPUT_EXTERNAL_MONOTONIC_ROOT_SIGNER_WORKFLOW: ${{ env.EXTERNAL_ROOT_SIGNER_WORKFLOW }}
          INPUT_EXTERNAL_MONOTONIC_ROOT_PREDICATE_TYPE: ${{ env.EXTERNAL_ROOT_PREDICATE_TYPE }}
        run: python3 effect_executor.py

      - name: Verify valid old signature cannot resurrect T2 authority
        shell: bash
        env:
          OUTCOME: ${{ steps.stale-root.outputs.effect-outcome }}
          TRIGGERED: ${{ steps.stale-root.outputs.rerun-triggered }}
          REASON: ${{ steps.stale-root.outputs.effect-reason }}
        run: |
          test "$OUTCOME" = "NOT_EXECUTED"
          test "$TRIGGERED" = "false"
          case "$REASON" in
            "EXTERNAL_MONOTONIC_ROOT_BLOCK: STALE_EXTERNAL_ROOT_ATTESTATION: supplied_epoch=2 latest_epoch=4") ;;
            *) echo "::error::valid stale T2 attestation regained authority: $REASON"; exit 1 ;;
          esac

      - name: Restore both local records to CLOSED T4
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.coordination-ref }}"             publish             --base-sha "${{ needs.establish-t2.outputs.token2 }}"             --owner replay-restore-t4             --candidate-sha "${{ needs.recover-close.outputs.token4 }}"             --result "$RUNNER_TEMP/replay-restore-coord.json"
          python3 e2e/linearizable_lease_cli.py             --repository "${{ github.repository }}"             --ref "${{ needs.seed.outputs.witness-ref }}"             publish             --base-sha "${{ needs.establish-t2.outputs.token2 }}"             --owner replay-restore-t4-witness             --candidate-sha "${{ needs.recover-close.outputs.token4 }}"             --result "$RUNNER_TEMP/replay-restore-witness.json"

      - uses: actions/upload-artifact@v4
        with:
          name: external-monotonic-root-stale-signed-replay-proof-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/stale-signed-root-replay.eba-receipt.json
          if-no-files-found: error

  reconcile:
    name: Reconcile external-root execution
    if: ${{ github.event.workflow_run.run_attempt == 2 && github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: reconcile
        uses: ./
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          auto-rerun: 'false'
          selective-rerun: 'false'
          history-runs: '1'

      - name: Verify external-root effect is attributable
        shell: bash
        env:
          STATUS: ${{ steps.reconcile.outputs.previous-reconciliation-status }}
        run: test "$STATUS" = "RECOVERED_AFTER_RERUN"

      - name: Preserve local CLOSED refs and public transparency evidence
        shell: bash
        run: |
          echo "CLOSED local refs are retained as fast-path high-water marks."
          echo "The signed external root remains independently verifiable through its Sigstore bundle."

  reject-extra-attempts:
    name: Reject extra external-root attempts
    if: ${{ github.event.workflow_run.run_attempt > 2 }}
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
