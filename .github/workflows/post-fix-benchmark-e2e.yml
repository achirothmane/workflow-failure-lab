name: Post-Fix Benchmark E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/post-fix-benchmark-trigger.txt'

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: gate
        uses: ./
        with:
          github-token: ${{ github.token }}
          auto-rerun: 'false'
          selective-rerun: 'false'
          policy-shadow-mode: 'false'
          history-runs: '0'
          comment-on-pr: 'false'
          benchmark-mode: 'true'
          benchmark-runs: '10'
          benchmark-rerun-runs: '20'
          benchmark-rerun-search-runs: '200'
          benchmark-repositories: |
            pallets/flask
            psf/requests
            pytest-dev/pytest
            axios/axios
            pnpm/pnpm
            docker/compose
            golangci/golangci-lint
            astral-sh/ruff
            serde-rs/serde
            hashicorp/terraform
      - name: Verify and show post-fix outputs
        shell: bash
        run: |
          echo "natural_runs=${{ steps.gate.outputs.benchmark-runs-analyzed }}"
          echo "natural_failed_jobs=${{ steps.gate.outputs.benchmark-failed-jobs }}"
          echo "rerun_runs=${{ steps.gate.outputs.benchmark-rerun-runs-analyzed }}"
          echo "rerun_failed_jobs=${{ steps.gate.outputs.benchmark-rerun-failed-jobs }}"
          echo "rerun_candidates=${{ steps.gate.outputs.benchmark-rerun-candidates }}"
          echo "rerun_evaluated=${{ steps.gate.outputs.benchmark-rerun-evaluated }}"
          echo "rerun_recoveries=${{ steps.gate.outputs.benchmark-rerun-recoveries }}"
          echo "rerun_false_positives=${{ steps.gate.outputs.benchmark-rerun-false-positives }}"
          echo "rerun_unknown=${{ steps.gate.outputs.benchmark-rerun-unknown-outcomes }}"
          echo "rerun_precision=${{ steps.gate.outputs.benchmark-rerun-observed-precision }}"
          test "${{ steps.gate.outputs.benchmark-repositories-analyzed }}" = "10"
