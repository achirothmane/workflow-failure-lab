name: Selective Rerun E2E Fixture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/selective-rerun-e2e-fixture.yml'
  workflow_dispatch:

jobs:
  transient-network:
    runs-on: ubuntu-latest
    steps:
      - name: Emit transient network failure
        shell: bash
        run: |
          echo "npm ERR! code ETIMEDOUT"
          echo "connect ETIMEDOUT 104.20.22.46:443"
          echo "Error: connection reset by peer"
          exit 1

  code-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Emit code regression failure
        shell: bash
        run: |
          echo "AssertionError: expected 2 == 3"
          echo "Tests failed"
          echo "Process completed with exit code 1"
          exit 1
