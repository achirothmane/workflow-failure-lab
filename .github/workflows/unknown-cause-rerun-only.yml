name: UNKNOWN Cause Rerun-Only Benchmark

on:
  push:
    branches:
      - test/unknown-cause-rerun-only

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run rerun-only UNKNOWN decomposition
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import os

          from benchmark_mode import collect_repository_samples
          from ci_retry_gate import GitHubAPI
          from unknown_failure_intelligence import summarize_unknown_patterns

          repos = [
              "pallets/flask","psf/requests","pytest-dev/pytest","axios/axios","pnpm/pnpm",
              "docker/compose","golangci/golangci-lint","astral-sh/ruff","serde-rs/serde",
              "hashicorp/terraform","django/django","fastapi/fastapi","encode/httpx",
              "tiangolo/sqlmodel","numpy/numpy","pandas-dev/pandas","pydantic/pydantic",
              "nodejs/node","denoland/deno","vitejs/vite","vercel/next.js","microsoft/TypeScript",
              "rust-lang/cargo","tokio-rs/tokio","BurntSushi/ripgrep","kubernetes/kubernetes",
              "helm/helm","prometheus/prometheus","grafana/grafana","hashicorp/vault"
          ]
          token = os.environ["INPUT_GITHUB_TOKEN"]

          def collect(repo):
              api = GitHubAPI(token)
              try:
                  _natural, enriched = collect_repository_samples(api, repo, 5, 20, 150)
                  return repo, enriched, None
              except RuntimeError as exc:
                  return repo, None, str(exc)[:240]

          rerun_histories, skipped = {}, []
          with ThreadPoolExecutor(max_workers=5) as pool:
              futures = [pool.submit(collect, repo) for repo in repos]
              for future in as_completed(futures):
                  repo, enriched, error = future.result()
                  if error:
                      skipped.append((repo, error))
                  else:
                      rerun_histories[repo] = enriched

          summary = summarize_unknown_patterns({}, rerun_histories)
          rerun_failures = sum(len(failures) for failures, _runs in rerun_histories.values())

          print("=== UNKNOWN CAUSE RERUN-ONLY ===")
          print(f"repositories_analyzed={len(rerun_histories)}")
          print(f"repositories_skipped={len(skipped)}")
          print(f"rerun_failed_jobs={rerun_failures}")
          print(f"rerun_unknown_failures={summary.unknown_failures}")
          print(f"rerun_unknown_patterns={len(summary.patterns)}")
          print(f"promotion_candidates={len(summary.promotion_candidates)}")
          print(f"accounted_unknowns={sum(item.occurrences for item in summary.causes)}")
          for cause in summary.causes:
              print(
                  f"unknown_cause={cause.cause} occurrences={cause.occurrences} "
                  f"repositories={cause.repositories} gt_reruns={cause.rerun_observations} "
                  f"validated_recoveries={cause.recoveries} failed_again={cause.failed_again} "
                  f"unknown_or_unverified={cause.unknown_outcomes} "
                  f"side_effects={cause.side_effect_occurrences}"
              )
          PY
