name: 30-Repo Missed Recovery Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/missed-recovery-30-trigger.txt'

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find recovered failures blocked by the classifier
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from ci_retry_gate import GitHubAPI, FAILURE_CONCLUSIONS, TRANSIENT_CATEGORIES, classify_log, detect_side_effect_risk
          from benchmark_mode import _list_completed_runs
          from history_ci_waste import _jobs_for_attempt, _later_rerun_outcome

          repos = '''
          pallets/flask
          psf/requests
          pytest-dev/pytest
          axios/axios
          pnpm/pnpm
          docker/compose
          golangci/golangci-lint
          astral-sh/ruff
          serde-rs/serde
          hashicorp/terraform
          django/django
          fastapi/fastapi
          encode/httpx
          tiangolo/sqlmodel
          numpy/numpy
          pandas-dev/pandas
          pydantic/pydantic
          nodejs/node
          denoland/deno
          vitejs/vite
          vercel/next.js
          microsoft/TypeScript
          rust-lang/cargo
          tokio-rs/tokio
          BurntSushi/ripgrep
          kubernetes/kubernetes
          helm/helm
          prometheus/prometheus
          grafana/grafana
          hashicorp/vault
          '''.split()

          api = GitHubAPI(os.environ['GITHUB_TOKEN'])
          recovered_total = 0
          recovered_candidates = 0
          missed_recoveries = 0
          rerun_runs = 0
          failed_jobs = 0

          for repo in repos:
              try:
                  runs = _list_completed_runs(api, repo, 150)
              except RuntimeError as exc:
                  print(f'SKIP repo={repo} reason={str(exc)[:140]}')
                  continue

              selected = [r for r in runs if int(r.get('run_attempt') or 1) > 1][:20]
              rerun_runs += len(selected)
              for run in selected:
                  run_id = int(run.get('id') or 0)
                  attempts = max(1, int(run.get('run_attempt') or 1))
                  attempt_jobs = {}
                  for attempt in range(1, attempts + 1):
                      try:
                          attempt_jobs[attempt] = _jobs_for_attempt(api, repo, run_id, attempt)
                      except RuntimeError:
                          attempt_jobs[attempt] = []

                  first_jobs = attempt_jobs.get(1, [])
                  workflow_side_effect = any(detect_side_effect_risk(j)[0] for j in first_jobs)
                  for job in first_jobs:
                      if str(job.get('conclusion') or '').lower() not in FAILURE_CONCLUSIONS:
                          continue
                      failed_jobs += 1
                      name = str(job.get('name') or '')
                      observed, recovered = _later_rerun_outcome(
                          attempt_jobs, 1, attempts, name, str(job.get('started_at') or '')
                      )
                      if not (observed and recovered):
                          continue

                      recovered_total += 1
                      try:
                          log = api.get_job_logs(repo, int(job.get('id') or 0))
                      except RuntimeError:
                          log = ''
                      c = classify_log(log)
                      own_side = detect_side_effect_risk(job)[0]
                      side = own_side or workflow_side_effect
                      candidate = c.category in TRANSIENT_CATEGORIES and c.confidence == 'high' and not side
                      if candidate:
                          recovered_candidates += 1
                      else:
                          missed_recoveries += 1

                      print(
                          f"RECOVERED repo={repo} run={run_id} job={name!r} "
                          f"category={c.category} confidence={c.confidence} score={c.score} "
                          f"side_effect={side} candidate={candidate}"
                      )
                      for evidence in c.evidence[:2]:
                          print('  EVIDENCE ' + evidence[:260])

          print(f'RERUN_RUNS={rerun_runs}')
          print(f'FAILED_JOBS={failed_jobs}')
          print(f'RECOVERED_TOTAL={recovered_total}')
          print(f'RECOVERED_CANDIDATES={recovered_candidates}')
          print(f'MISSED_RECOVERIES={missed_recoveries}')
          PY
