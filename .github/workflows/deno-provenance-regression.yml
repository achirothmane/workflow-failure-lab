name: Deno Provenance Regression

on:
  push:
    branches:
      - test/deno-provenance-regression

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect denoland deno rerun sample
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from benchmark_mode import collect_repository_samples, _rejection_reason
          from ci_retry_gate import GitHubAPI

          api = GitHubAPI(os.environ["INPUT_GITHUB_TOKEN"])
          natural, enriched = collect_repository_samples(api, "denoland/deno", 5, 20, 150)
          failures, runs = enriched
          print(f"rerun_runs={runs}")
          print(f"failures={len(failures)}")
          for item in failures:
              if item.run_id == 35092912997 or item.job_name == "version bump":
                  print(
                      f"TARGET run_id={item.run_id} job={item.job_name!r} "
                      f"category={item.category} confidence={item.confidence} "
                      f"side_effect={item.side_effect_risk} provenance={item.provenance_status} "
                      f"rejection={_rejection_reason(item)} recovered={item.recovered_after_rerun} "
                      f"signature={item.signature!r}"
                  )
          PY
