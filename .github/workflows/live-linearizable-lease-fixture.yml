name: Live Linearizable Lease CAS Fixture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-linearizable-lease-fixture.yml'
      - '.github/workflows/live-linearizable-lease-controller.yml'
      - 'linearizable_lease.py'
      - 'effect_executor.py'
      - 'e2e/linearizable_lease_cli.py'
      - 'e2e/takeover_bundle_manifest.py'
      - 'tests/test_linearizable_lease.py'
      - 'tests/test_live_linearizable_lease_workflow.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transient:
    name: Linearizable-lease transient probe
    runs-on: ubuntu-latest
    steps:
      - name: Emit one bounded transient failure
        shell: bash
        run: |
          echo "fixture run_id=${GITHUB_RUN_ID} attempt=${GITHUB_RUN_ATTEMPT}"
          if [ "${GITHUB_RUN_ATTEMPT}" = "1" ]; then
            echo "curl: (6) Could not resolve host: linearizable-lease.invalid"
            exit 1
          fi

          sleep 20
          echo "linearizable lease fixture recovered on attempt ${GITHUB_RUN_ATTEMPT}"
