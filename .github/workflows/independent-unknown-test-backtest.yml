name: Independent UNKNOWN Test Backtest

on:
  push:
    branches: [independent-unknown-test-backtest]

permissions:
  contents: read
  actions: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan external reruns with production classifier
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: python3 scripts/independent_unknown_test_backtest.py
