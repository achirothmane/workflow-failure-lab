name: Coverage Attribution 30 Repo Benchmark

on:
  push:
    branches:
      - test/coverage-attribution-benchmark

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run parallel benchmark
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import os

          from benchmark_mode import collect_repository_samples, summarize_benchmark
          from ci_retry_gate import GitHubAPI
          from coverage_attribution import evidence_gap_count

          repos = [
              "pallets/flask","psf/requests","pytest-dev/pytest","axios/axios","pnpm/pnpm",
              "docker/compose","golangci/golangci-lint","astral-sh/ruff","serde-rs/serde",
              "hashicorp/terraform","django/django","fastapi/fastapi","encode/httpx",
              "tiangolo/sqlmodel","numpy/numpy","pandas-dev/pandas","pydantic/pydantic",
              "nodejs/node","denoland/deno","vitejs/vite","vercel/next.js","microsoft/TypeScript",
              "rust-lang/cargo","tokio-rs/tokio","BurntSushi/ripgrep","kubernetes/kubernetes",
              "helm/helm","prometheus/prometheus","grafana/grafana","hashicorp/vault"
          ]
          token = os.environ["INPUT_GITHUB_TOKEN"]

          def collect(repo):
              api = GitHubAPI(token)
              try:
                  natural, enriched = collect_repository_samples(api, repo, 5, 20, 150)
                  return repo, natural, enriched, None
              except RuntimeError as exc:
                  return repo, None, None, str(exc)[:240]

          histories, rerun_histories, skipped = {}, {}, []
          with ThreadPoolExecutor(max_workers=5) as pool:
              futures = [pool.submit(collect, repo) for repo in repos]
              for future in as_completed(futures):
                  repo, natural, enriched, error = future.result()
                  if error:
                      skipped.append((repo, error))
                  else:
                      histories[repo] = natural
                      rerun_histories[repo] = enriched

          summary = summarize_benchmark(
              histories,
              rerun_histories=rerun_histories,
              repositories_requested=len(repos),
              skipped=tuple(sorted(skipped)),
          )

          print("=== COVERAGE ATTRIBUTION BENCHMARK ===")
          print(f"repositories_analyzed={summary.repositories_analyzed}")
          print(f"repositories_skipped={summary.repositories_skipped}")
          print(f"natural_failed_jobs={summary.failed_jobs}")
          print(f"rerun_failed_jobs={summary.rerun_failed_jobs}")
          print(f"safe_candidates={summary.rerun_candidates}")
          print(f"evidence_gap_failures={evidence_gap_count(summary.coverage_attribution)}")
          for item in summary.coverage_attribution:
              print(
                  f"coverage_gate={item.gate} kind={item.kind} failures={item.failures} "
                  f"raw_later_successes={item.raw_later_successes} "
                  f"validated_recoveries={item.validated_recoveries} "
                  f"failed_reruns={item.failed_reruns} "
                  f"unknown_or_unverified={item.unknown_or_unverified}"
              )
          print(f"validated_recoveries={summary.rerun_recoveries}")
          print(f"ground_truth_evaluated={summary.rerun_evaluated}")
          print(f"ground_truth_precision={summary.rerun_observed_precision:.4f}")
          print(f"unknown_promotion_candidates={len(summary.unknown_intelligence.promotion_candidates)}")
          PY
