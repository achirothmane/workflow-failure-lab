name: Live Audit Chain Replay Controller

on:
  workflow_run:
    workflows: ["Live Audit Chain Replay Fixture"]
    types: [completed]

permissions:
  contents: read
  actions: write
  checks: read

jobs:
  adversarial-replay:
    name: Reject stale duplicate effect replay
    if: ${{ github.event.workflow_run.repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: gate
        name: Build deferred admitted decision
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        shell: bash
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ github.event.workflow_run.id }}
          INPUT_REPOSITORY: ${{ github.repository }}
          INPUT_AUTO_RERUN: 'true'
          INPUT_DEFER_EFFECT: 'true'
          INPUT_MAX_ATTEMPTS: '2'
          INPUT_COMMENT_ON_PR: 'false'
        run: python3 ci_retry_gate.py

      - name: Verify initial decision is admitted
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        shell: bash
        env:
          DECISION: ${{ steps.gate.outputs.decision }}
          EVIDENCE_STATUS: ${{ steps.gate.outputs.evidence-status }}
          MUTATION_ADMITTED: ${{ steps.gate.outputs.mutation-admitted }}
        run: |
          test "$DECISION" = "ALLOW"
          test "$EVIDENCE_STATUS" = "SUFFICIENT"
          test "$MUTATION_ADMITTED" = "true"

      - name: Persist pre-effect audit trail
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gate.outputs.decision-record-artifact-name }}
          path: |
            ${{ steps.gate.outputs.decision-record-path }}
            ${{ steps.gate.outputs.effect-plan-path }}
          if-no-files-found: error

      - id: effect
        name: Execute the admitted effect once
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        shell: bash
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_EFFECT_PLAN_PATH: ${{ steps.gate.outputs.effect-plan-path }}
          INPUT_EFFECT_PLAN_SHA256: ${{ steps.gate.outputs.effect-plan-sha256 }}
          INPUT_DECISION_RECORD_PATH: ${{ steps.gate.outputs.decision-record-path }}
          INPUT_DECISION_RECORD_SHA256: ${{ steps.gate.outputs.decision-record-sha256 }}
          INPUT_EBA_REQUEST_PATH: ${{ steps.gate.outputs.eba-request-path }}
          INPUT_EBA_REQUEST_SHA256: ${{ steps.gate.outputs.eba-request-sha256 }}
          INPUT_EBA_ASSUMPTION_PATH: ${{ steps.gate.outputs.eba-assumption-path }}
          INPUT_EBA_ASSUMPTION_SHA256: ${{ steps.gate.outputs.eba-assumption-sha256 }}
          INPUT_EBA_AUTHORITY_PATH: ${{ steps.gate.outputs.eba-authority-path }}
          INPUT_EBA_AUTHORITY_SHA256: ${{ steps.gate.outputs.eba-authority-sha256 }}
          INPUT_EBA_DECISION_PATH: ${{ steps.gate.outputs.eba-decision-path }}
          INPUT_EBA_DECISION_SHA256: ${{ steps.gate.outputs.eba-decision-sha256 }}
          INPUT_EBA_RECEIPT_PATH: ${{ steps.gate.outputs.eba-receipt-path }}
          INPUT_DECISION_EXPERIENCE_JSON: ${{ steps.gate.outputs.decision-experience-json }}
        run: python3 effect_executor.py

      - name: Persist confirmed execution receipt
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gate.outputs.decision-record-artifact-name }}-receipt
          path: ${{ steps.effect.outputs.eba-receipt-path }}
          if-no-files-found: error

      - name: Verify first effect was accepted
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        shell: bash
        env:
          OUTCOME: ${{ steps.effect.outputs.effect-outcome }}
          TRIGGERED: ${{ steps.effect.outputs.rerun-triggered }}
        run: |
          test "$OUTCOME" = "SUCCEEDED"
          test "$TRIGGERED" = "true"

      - name: Wait for target state to advance to attempt 2
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.request

          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repo = os.environ["TARGET_REPOSITORY"]
          run_id = os.environ["TARGET_RUN_ID"]
          token = os.environ["GITHUB_TOKEN"]
          url = f"{api}/repos/{repo}/actions/runs/{run_id}"

          for _ in range(45):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  payload = json.load(response)
              if int(payload.get("run_attempt") or 0) >= 2:
                  print("target advanced to attempt 2")
                  break
              time.sleep(1)
          else:
              raise SystemExit("target did not advance to attempt 2 before stale replay")
          PY

      - id: duplicate
        name: Replay the same stale admitted plan
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        shell: bash
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
          INPUT_EFFECT_PLAN_PATH: ${{ steps.gate.outputs.effect-plan-path }}
          INPUT_EFFECT_PLAN_SHA256: ${{ steps.gate.outputs.effect-plan-sha256 }}
          INPUT_DECISION_RECORD_PATH: ${{ steps.gate.outputs.decision-record-path }}
          INPUT_DECISION_RECORD_SHA256: ${{ steps.gate.outputs.decision-record-sha256 }}
          INPUT_EBA_REQUEST_PATH: ${{ steps.gate.outputs.eba-request-path }}
          INPUT_EBA_REQUEST_SHA256: ${{ steps.gate.outputs.eba-request-sha256 }}
          INPUT_EBA_ASSUMPTION_PATH: ${{ steps.gate.outputs.eba-assumption-path }}
          INPUT_EBA_ASSUMPTION_SHA256: ${{ steps.gate.outputs.eba-assumption-sha256 }}
          INPUT_EBA_AUTHORITY_PATH: ${{ steps.gate.outputs.eba-authority-path }}
          INPUT_EBA_AUTHORITY_SHA256: ${{ steps.gate.outputs.eba-authority-sha256 }}
          INPUT_EBA_DECISION_PATH: ${{ steps.gate.outputs.eba-decision-path }}
          INPUT_EBA_DECISION_SHA256: ${{ steps.gate.outputs.eba-decision-sha256 }}
          INPUT_EBA_RECEIPT_PATH: ${{ runner.temp }}/duplicate-replay.eba-receipt.json
          INPUT_DECISION_EXPERIENCE_JSON: ${{ steps.gate.outputs.decision-experience-json }}
        run: python3 effect_executor.py

      - name: Verify stale duplicate was denied
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        shell: bash
        env:
          OUTCOME: ${{ steps.duplicate.outputs.effect-outcome }}
          TRIGGERED: ${{ steps.duplicate.outputs.rerun-triggered }}
          REASON: ${{ steps.duplicate.outputs.effect-reason }}
        run: |
          test "$OUTCOME" = "NOT_EXECUTED"
          test "$TRIGGERED" = "false"
          case "$REASON" in
            RERUN_SCOPE_CHANGED:*) ;;
            *) echo "::error::unexpected duplicate replay reason: $REASON"; exit 1 ;;
          esac

      - name: Persist duplicate replay proof
        if: ${{ github.event.workflow_run.run_attempt == 1 }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gate.outputs.decision-record-artifact-name }}-duplicate-replay-proof
          path: ${{ steps.duplicate.outputs.eba-receipt-path }}
          if-no-files-found: error

      - id: reconcile
        name: Reconcile the real next attempt
        if: ${{ github.event.workflow_run.run_attempt == 2 }}
        uses: ./
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          repository: ${{ github.repository }}
          auto-rerun: 'false'
          selective-rerun: 'false'
          history-runs: '1'

      - name: Verify confirmed recovery survived the replay attack
        if: ${{ github.event.workflow_run.run_attempt == 2 }}
        shell: bash
        env:
          STATUS: ${{ steps.reconcile.outputs.previous-reconciliation-status }}
          OUTCOME_PATH: ${{ steps.reconcile.outputs.outcome-record-path }}
          RECONCILIATION_PATH: ${{ steps.reconcile.outputs.reconciliation-record-path }}
        run: |
          test "$STATUS" = "RECOVERED_AFTER_RERUN"
          test -n "$OUTCOME_PATH"
          test -n "$RECONCILIATION_PATH"

      - name: Reject unexpected extra attempts
        if: ${{ github.event.workflow_run.run_attempt > 2 }}
        shell: bash
        run: |
          echo "::error::stale replay caused an unexpected extra attempt"
          exit 1
