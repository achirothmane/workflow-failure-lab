name: Terraform Real Log Regression

on:
  push:
    branches: [main]
    paths:
      - '.github/terraform-real-log-regression-trigger.txt'

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Classify real Terraform recovered failure
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from ci_retry_gate import GitHubAPI, classify_log

          api = GitHubAPI(os.environ['GITHUB_TOKEN'])
          log = api.get_job_logs('hashicorp/terraform', 104489284019)
          result = classify_log(log)
          print(f'category={result.category}')
          print(f'confidence={result.confidence}')
          print(f'score={result.score}')
          for line in result.evidence:
              print('evidence=' + line)
          assert result.category == 'DEPENDENCY_NETWORK'
          assert result.confidence == 'high'
          assert any('read tcp' in line.lower() and 'connection reset by peer' in line.lower() for line in result.evidence)
          assert all('\x1b' not in line for line in result.evidence)
          PY
