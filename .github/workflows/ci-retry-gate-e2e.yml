name: CI Retry Gate E2E

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  transient-fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Simulate transient dependency failure
        run: |
          echo "npm ERR! code ETIMEDOUT"
          echo "connect ETIMEDOUT 104.20.22.46:443"
          echo "Error: connection reset by peer"
          exit 1

  gate-read-only:
    runs-on: ubuntu-latest
    needs: transient-fixture
    if: always()
    steps:
      - uses: actions/checkout@v4
      - id: gate
        uses: ./
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          auto-rerun: 'false'
          comment-on-pr: 'false'
      - name: Verify safety decision
        shell: bash
        env:
          SAFE_TO_RERUN: ${{ steps.gate.outputs.safe-to-rerun }}
          FAILED_JOBS: ${{ steps.gate.outputs.failed-jobs }}
          RERUN_TRIGGERED: ${{ steps.gate.outputs.rerun-triggered }}
        run: |
          test "$SAFE_TO_RERUN" = "true"
          test "$FAILED_JOBS" = "1"
          test "$RERUN_TRIGGERED" = "false"
