name: Benchmark E2E 10 Repos

on:
  push:
    branches: [main]
    paths:
      - '.github/benchmark-e2e-trigger.txt'

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: gate
        uses: ./
        with:
          github-token: ${{ github.token }}
          auto-rerun: 'false'
          selective-rerun: 'false'
          policy-shadow-mode: 'false'
          history-runs: '0'
          comment-on-pr: 'false'
          benchmark-mode: 'true'
          benchmark-runs: '25'
          benchmark-repositories: |
            pallets/flask
            psf/requests
            pytest-dev/pytest
            axios/axios
            pnpm/pnpm
            docker/compose
            golangci/golangci-lint
            astral-sh/ruff
            serde-rs/serde
            hashicorp/terraform

      - name: Show benchmark outputs
        shell: bash
        run: |
          echo "repositories_analyzed=${{ steps.gate.outputs.benchmark-repositories-analyzed }}"
          echo "repositories_skipped=${{ steps.gate.outputs.benchmark-repositories-skipped }}"
          echo "runs_analyzed=${{ steps.gate.outputs.benchmark-runs-analyzed }}"
          echo "failed_jobs=${{ steps.gate.outputs.benchmark-failed-jobs }}"
          echo "shadow_decisions=${{ steps.gate.outputs.benchmark-shadow-decisions }}"
          echo "evaluated=${{ steps.gate.outputs.benchmark-evaluated-decisions }}"
          echo "recoveries=${{ steps.gate.outputs.benchmark-recoveries }}"
          echo "false_positives=${{ steps.gate.outputs.benchmark-false-positives }}"
          echo "unknown=${{ steps.gate.outputs.benchmark-unknown-outcomes }}"
          echo "precision=${{ steps.gate.outputs.benchmark-observed-precision }}"
          echo "decision_coverage=${{ steps.gate.outputs.benchmark-decision-coverage }}"
          echo "evaluated_coverage=${{ steps.gate.outputs.benchmark-evaluated-coverage }}"
