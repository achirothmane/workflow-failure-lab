name: SERVER 5XX Shadow Rule 50 Repo

on:
  push:
    branches:
      - test/server5xx-shadow-rule-50repo

permissions:
  actions: read
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Evaluate SERVER_5XX shadow rule across 50 repos
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import os

          from benchmark_mode import collect_repository_samples
          from ci_retry_gate import GitHubAPI
          from classifier_rule_research import evaluate_server5xx_shadow_rule

          repos = [
              "pallets/flask","psf/requests","pytest-dev/pytest","axios/axios","pnpm/pnpm",
              "docker/compose","golangci/golangci-lint","astral-sh/ruff","serde-rs/serde",
              "hashicorp/terraform","django/django","fastapi/fastapi","encode/httpx",
              "tiangolo/sqlmodel","numpy/numpy","pandas-dev/pandas","pydantic/pydantic",
              "nodejs/node","denoland/deno","vitejs/vite","vercel/next.js","microsoft/TypeScript",
              "rust-lang/cargo","tokio-rs/tokio","BurntSushi/ripgrep","kubernetes/kubernetes",
              "helm/helm","prometheus/prometheus","grafana/grafana","hashicorp/vault",
              "facebook/react","microsoft/vscode","microsoft/playwright","pytorch/pytorch",
              "scikit-learn/scikit-learn","matplotlib/matplotlib","ansible/ansible",
              "home-assistant/core","getsentry/sentry","caddyserver/caddy","traefik/traefik",
              "ollama/ollama","huggingface/transformers","langchain-ai/langchain",
              "openai/openai-python","prisma/prisma","electron/electron","webpack/webpack",
              "grpc/grpc","curl/curl"
          ]
          token = os.environ["INPUT_GITHUB_TOKEN"]

          def collect(repo):
              api = GitHubAPI(token)
              try:
                  natural, enriched = collect_repository_samples(api, repo, 5, 50, 500)
                  return repo, natural, enriched, None
              except RuntimeError as exc:
                  return repo, None, None, str(exc)[:240]

          natural_histories, rerun_histories, skipped = {}, {}, []
          with ThreadPoolExecutor(max_workers=5) as pool:
              futures = [pool.submit(collect, repo) for repo in repos]
              for future in as_completed(futures):
                  repo, natural, enriched, error = future.result()
                  if error:
                      skipped.append((repo, error))
                  else:
                      natural_histories[repo] = natural
                      rerun_histories[repo] = enriched

          summary = evaluate_server5xx_shadow_rule(
              natural_histories,
              rerun_histories,
          )

          print("=== SERVER_5XX SHADOW RULE 50 REPO ===")
          print(f"repositories_analyzed={len(natural_histories)}")
          print(f"repositories_skipped={len(skipped)}")
          print(f"natural_unknown_failures={summary.natural_unknown_failures}")
          print(f"natural_matches={len(summary.natural_matches)}")
          print(f"natural_match_rate={summary.natural_match_rate:.6f}")
          print(f"rerun_matches={len(summary.rerun_matches)}")
          print(f"evaluable_matches={summary.evaluable_matches}")
          print(f"validated_recoveries={summary.validated_recoveries}")
          print(f"false_positives={summary.failed_again}")
          print(f"unknown_outcomes={summary.unknown_outcomes}")
          print(f"observed_precision={summary.observed_precision:.6f}")
          print(f"independent_runs={summary.independent_runs}")
          print(f"independent_repositories={summary.independent_repositories}")
          print(f"side_effect_matches={summary.side_effect_matches}")
          print(f"authority_safe_matches={summary.authority_safe_matches}")
          print(f"authority_blocked_matches={summary.authority_blocked_matches}")

          for item in summary.rerun_matches:
              print(
                  f"MATCH repo={item.repository} run_id={item.run_id} job={item.job_name!r} "
                  f"outcome={item.recovery_status} side_effect={item.side_effect_risk} "
                  f"signature={item.signature.replace('##[', 'GH_ANNOTATION[')!r}"
              )
              for evidence in item.evidence:
                  print(f"EVIDENCE {evidence.replace('##[', 'GH_ANNOTATION[')}")

          for item in summary.false_positive_matches:
              print(
                  f"FALSE_POSITIVE repo={item.repository} run_id={item.run_id} "
                  f"job={item.job_name!r} signature={item.signature.replace('##[', 'GH_ANNOTATION[')!r}"
              )

          for repo, error in sorted(skipped):
              print(f"SKIPPED repo={repo} error={error!r}")
          PY
