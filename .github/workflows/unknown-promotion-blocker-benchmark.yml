name: UNKNOWN Promotion Blocker Benchmark

on:
  push:
    branches:
      - test/unknown-promotion-blocker-benchmark

permissions:
  actions: read
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run promotion blocker attribution
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import os

          from benchmark_mode import collect_repository_samples, summarize_benchmark
          from ci_retry_gate import GitHubAPI

          repos = [
              "pallets/flask","psf/requests","pytest-dev/pytest","axios/axios","pnpm/pnpm",
              "docker/compose","golangci/golangci-lint","astral-sh/ruff","serde-rs/serde",
              "hashicorp/terraform","django/django","fastapi/fastapi","encode/httpx",
              "tiangolo/sqlmodel","numpy/numpy","pandas-dev/pandas","pydantic/pydantic",
              "nodejs/node","denoland/deno","vitejs/vite","vercel/next.js","microsoft/TypeScript",
              "rust-lang/cargo","tokio-rs/tokio","BurntSushi/ripgrep","kubernetes/kubernetes",
              "helm/helm","prometheus/prometheus","grafana/grafana","hashicorp/vault"
          ]
          token = os.environ["INPUT_GITHUB_TOKEN"]

          def collect(repo):
              api = GitHubAPI(token)
              try:
                  natural, enriched = collect_repository_samples(api, repo, 5, 20, 150)
                  return repo, natural, enriched, None
              except RuntimeError as exc:
                  return repo, None, None, str(exc)[:240]

          histories, rerun_histories, skipped = {}, {}, []
          with ThreadPoolExecutor(max_workers=5) as pool:
              futures = [pool.submit(collect, repo) for repo in repos]
              for future in as_completed(futures):
                  repo, natural, enriched, error = future.result()
                  if error:
                      skipped.append((repo, error))
                  else:
                      histories[repo] = natural
                      rerun_histories[repo] = enriched

          summary = summarize_benchmark(
              histories,
              rerun_histories=rerun_histories,
              repositories_requested=len(repos),
              skipped=tuple(sorted(skipped)),
          )
          unknown = summary.unknown_intelligence

          print("=== UNKNOWN PROMOTION BLOCKER BENCHMARK ===")
          print(f"repositories_analyzed={summary.repositories_analyzed}")
          print(f"repositories_skipped={summary.repositories_skipped}")
          print(f"rerun_failed_jobs={summary.rerun_failed_jobs}")
          print(f"runtime_safe_candidates={summary.rerun_candidates}")
          print(f"unknown_failures={unknown.unknown_failures}")
          print(f"unknown_patterns={len(unknown.patterns)}")
          print(f"validated_unknown_recoveries={unknown.recoveries}")
          print(f"promotion_candidates={len(unknown.promotion_candidates)}")
          print(f"near_promotion_candidates={len(unknown.near_promotion_candidates)}")

          for blocker, count in unknown.promotion_blocker_counts:
              print(f"promotion_blocker={blocker} patterns={count}")

          for item in unknown.near_promotion_candidates[:20]:
              blockers = ",".join(item.promotion_blockers)
              print(
                  f"near_pattern={item.pattern_id} occurrences={item.occurrences} "
                  f"repositories={item.repositories} gt_reruns={item.rerun_observations} "
                  f"recoveries={item.recoveries} recovery_rate={item.recovery_rate:.4f} "
                  f"side_effects={item.side_effect_occurrences} "
                  f"primary_blocker={item.promotion_blocker} blockers={blockers!r} "
                  f"occurrence_deficit={item.occurrence_deficit} "
                  f"gt_rerun_deficit={item.gt_rerun_deficit} "
                  f"recovery_rate_deficit={item.recovery_rate_deficit:.4f} "
                  f"signature={item.signature!r}"
              )

          for item in unknown.patterns[:30]:
              if item.promotion_candidate or item.promotion_distance <= 2:
                  print(
                      f"readiness_pattern={item.pattern_id} distance={item.promotion_distance} "
                      f"occurrences={item.occurrences} gt_reruns={item.rerun_observations} "
                      f"recoveries={item.recoveries} side_effects={item.side_effect_occurrences} "
                      f"primary={item.promotion_blocker} signature={item.signature!r}"
                  )
          PY
