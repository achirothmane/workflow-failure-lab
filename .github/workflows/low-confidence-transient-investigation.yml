name: Validate Requests Timeout Prose Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/low-confidence-transient-trigger.txt'

permissions:
  actions: read
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reclassify real psf/requests historical job
        shell: bash
        env:
          INPUT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os
          from ci_retry_gate import GitHubAPI, classify_log

          api = GitHubAPI(os.environ["INPUT_GITHUB_TOKEN"])
          log = api.get_job_logs("psf/requests", 97515783804)
          result = classify_log(log)
          print(f"category={result.category}")
          print(f"confidence={result.confidence}")
          print(f"score={result.score}")
          print(f"evidence={result.evidence}")
          annotations = [
              line.strip()
              for line in log.splitlines()
              if "##[error]" in line.lower()
          ][-10:]
          print("error_annotations:")
          for line in annotations:
              print(line)
          assert result.category == "UNKNOWN", result
          assert result.confidence == "low", result
          PY
