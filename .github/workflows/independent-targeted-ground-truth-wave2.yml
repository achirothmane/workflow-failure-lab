name: Independent Targeted Ground Truth Wave 2

on:
  push:
    branches: [independent-targeted-ground-truth-wave2]

permissions:
  contents: read
  actions: read

jobs:
  ground-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Analyze independent rerun wave 2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}
        run: python3 scripts/independent_targeted_ground_truth_wave2.py
