name: Independent Rerun Benchmark Wave 1

on:
  push:
    branches: [independent-rerun-benchmark-wave1]

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run independent rerun-enriched benchmark
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INPUT_BENCHMARK_REPOSITORIES: >-
            DataDog/dd-trace-js
            ckan/ckan
            opennextjs/opennextjs-netlify
            open-telemetry/opentelemetry-dotnet
            open-data/ckanext-canada
          INPUT_BENCHMARK_RUNS: "10"
          INPUT_BENCHMARK_RERUN_RUNS: "10"
          INPUT_BENCHMARK_RERUN_SEARCH_RUNS: "100"
        run: python3 benchmark_mode.py
