name: 'CI Retry Gate'
description: 'Classify failed GitHub Actions jobs, gate safe reruns, fingerprint recurring failures, learn conservative retry policies, shadow-test them, benchmark across repositories, and surface CI waste.'
author: 'othy19904-eng'

inputs:
  github-token:
    description: 'GitHub token. actions:read is required; actions:write is required only when a rerun mode is enabled.'
    required: true
  run-id:
    description: 'Workflow run ID to inspect. Defaults to github.event.workflow_run.id.'
    required: false
    default: ''
  repository:
    description: 'Repository in owner/name form. Defaults to github.repository.'
    required: false
    default: ''
  auto-rerun:
    description: 'Legacy all-or-nothing rerun mode. Reruns failed jobs only when every failed job passes the safety gate.'
    required: false
    default: 'false'
  selective-rerun:
    description: 'Rerun only individually safe high-confidence transient failed jobs. Cannot be combined with auto-rerun.'
    required: false
    default: 'false'
  max-attempts:
    description: 'Maximum total attempts for the target workflow run.'
    required: false
    default: '2'
  comment-on-pr:
    description: 'Post the gate report to the pull request when one is associated with the failed run.'
    required: false
    default: 'true'
  history-runs:
    description: 'Number of previous completed runs of the same workflow to inspect for recurring failures, fingerprints, rerun recovery, policy learning, shadow testing, and CI waste. Capped at 50.'
    required: false
    default: '10'
  policy-shadow-mode:
    description: 'Run a read-only retrospective backtest of learned AUTO_RERUN_ONCE policies. Does not trigger reruns. Opt-in because it performs an additional history scan.'
    required: false
    default: 'false'
  benchmark-mode:
    description: 'Run a read-only cross-repository benchmark with separate natural-coverage and rerun-enriched precision samples. No rerun is triggered.'
    required: false
    default: 'false'
  benchmark-repositories:
    description: 'Comma-, space-, or newline-separated owner/name repositories to benchmark. Capped at 50. Defaults to the current repository when empty.'
    required: false
    default: ''
  benchmark-runs:
    description: 'Recent completed workflow runs per repository for the natural coverage sample. Capped at 50.'
    required: false
    default: '20'
  benchmark-rerun-runs:
    description: 'Maximum historical rerun runs per repository for the rerun-enriched precision sample. Capped at 50.'
    required: false
    default: '20'
  benchmark-rerun-search-runs:
    description: 'Completed-run history window searched for run_attempt > 1 when building the rerun-enriched sample. Capped at 500.'
    required: false
    default: '200'

outputs:
  safe-to-rerun:
    description: 'true only when every failed job is a high-confidence transient failure and no side-effect signal is present.'
    value: ${{ steps.gate.outputs.safe-to-rerun }}
  rerun-triggered:
    description: 'true when legacy auto-rerun was enabled and a rerun was triggered.'
    value: ${{ steps.gate.outputs.rerun-triggered }}
  failed-jobs:
    description: 'Number of failed jobs assessed in the current run.'
    value: ${{ steps.gate.outputs.failed-jobs }}
  wasted-minutes:
    description: 'Observed runtime in minutes across failed jobs in the current run.'
    value: ${{ steps.gate.outputs.wasted-minutes }}
  selective-safe-jobs:
    description: 'Number of failed jobs that qualified for selective safe rerun.'
    value: ${{ steps.selective.outputs.selective-safe-jobs }}
  selective-blocked-jobs:
    description: 'Number of failed jobs blocked from selective rerun.'
    value: ${{ steps.selective.outputs.selective-blocked-jobs }}
  selective-reruns-triggered:
    description: 'Number of individual job reruns requested by selective mode.'
    value: ${{ steps.selective.outputs.selective-reruns-triggered }}
  history-runs-analyzed:
    description: 'Number of previous workflow runs inspected.'
    value: ${{ steps.history.outputs.history-runs-analyzed }}
  historical-failed-minutes:
    description: 'Runtime in minutes across failed jobs in sampled historical runs; not all of this is necessarily waste.'
    value: ${{ steps.history.outputs.historical-failed-minutes }}
  historical-transient-waste-minutes:
    description: 'Historical failed-job runtime classified as high-confidence runner/infrastructure or dependency/network failure.'
    value: ${{ steps.history.outputs.historical-transient-waste-minutes }}
  recurring-failures:
    description: 'Number of broader recurring job/category failure patterns seen at least twice in sampled history.'
    value: ${{ steps.history.outputs.recurring-failures }}
  failure-fingerprints:
    description: 'Number of distinct normalized failure fingerprints observed in sampled history.'
    value: ${{ steps.history.outputs.failure-fingerprints }}
  recurring-fingerprints:
    description: 'Number of exact normalized failure fingerprints seen at least twice in sampled history.'
    value: ${{ steps.history.outputs.recurring-fingerprints }}
  rerun-recoveries:
    description: 'Number of historical failed jobs that later succeeded in a genuine subsequent execution of the same job, before ground-truth attribution.'
    value: ${{ steps.history.outputs.rerun-recoveries }}
  validated-rerun-recoveries:
    description: 'Later successes where failure-step outcome provenance uniquely identified the original failed step and the same step was re-executed successfully.'
    value: ${{ steps.history.outputs.validated-rerun-recoveries }}
  policy-auto-rerun-fingerprints:
    description: 'Number of fingerprints for which Policy Learning recommends AUTO_RERUN_ONCE.'
    value: ${{ steps.history.outputs.policy-auto-rerun-fingerprints }}
  policy-manual-review-fingerprints:
    description: 'Number of fingerprints for which Policy Learning recommends MANUAL_REVIEW.'
    value: ${{ steps.history.outputs.policy-manual-review-fingerprints }}
  policy-blocked-fingerprints:
    description: 'Number of fingerprints for which Policy Learning recommends DO_NOT_AUTO_RERUN.'
    value: ${{ steps.history.outputs.policy-blocked-fingerprints }}
  shadow-decisions:
    description: 'Historical points where prior evidence alone would have recommended AUTO_RERUN_ONCE.'
    value: ${{ steps.shadow.outputs.shadow-decisions }}
  shadow-evaluated-decisions:
    description: 'Shadow decisions for which a real historical rerun outcome is observable.'
    value: ${{ steps.shadow.outputs.shadow-evaluated-decisions }}
  shadow-recoveries:
    description: 'Evaluated shadow decisions whose real rerun later recovered.'
    value: ${{ steps.shadow.outputs.shadow-recoveries }}
  shadow-false-positives:
    description: 'Evaluated shadow decisions whose real rerun did not recover.'
    value: ${{ steps.shadow.outputs.shadow-false-positives }}
  shadow-unknown-outcomes:
    description: 'Shadow decisions with no historical real rerun, so the counterfactual outcome is unknown.'
    value: ${{ steps.shadow.outputs.shadow-unknown-outcomes }}
  shadow-observed-precision:
    description: 'Recoveries divided by evaluated shadow decisions, expressed as a decimal from 0 to 1.'
    value: ${{ steps.shadow.outputs.shadow-observed-precision }}
  shadow-recoverable-failed-minutes:
    description: 'Failed-job runtime represented by observed shadow recoveries. This is evidence volume, not billed CI minutes saved.'
    value: ${{ steps.shadow.outputs.shadow-recoverable-failed-minutes }}
  benchmark-repositories-analyzed:
    description: 'Number of repositories successfully included in Benchmark Mode.'
    value: ${{ steps.benchmark.outputs.benchmark-repositories-analyzed }}
  benchmark-repositories-skipped:
    description: 'Number of requested repositories Benchmark Mode could not analyze.'
    value: ${{ steps.benchmark.outputs.benchmark-repositories-skipped }}
  benchmark-runs-analyzed:
    description: 'Natural-sample recent completed workflow runs analyzed across benchmark repositories.'
    value: ${{ steps.benchmark.outputs.benchmark-runs-analyzed }}
  benchmark-failed-jobs:
    description: 'Natural-sample first-attempt failed jobs observed by Benchmark Mode.'
    value: ${{ steps.benchmark.outputs.benchmark-failed-jobs }}
  benchmark-shadow-decisions:
    description: 'Natural-sample learned AUTO_RERUN_ONCE decisions simulated across benchmark repositories.'
    value: ${{ steps.benchmark.outputs.benchmark-shadow-decisions }}
  benchmark-evaluated-decisions:
    description: 'Natural-sample shadow decisions with an observed historical rerun outcome.'
    value: ${{ steps.benchmark.outputs.benchmark-evaluated-decisions }}
  benchmark-recoveries:
    description: 'Natural-sample evaluated benchmark decisions whose real rerun recovered.'
    value: ${{ steps.benchmark.outputs.benchmark-recoveries }}
  benchmark-false-positives:
    description: 'Natural-sample evaluated benchmark decisions whose real rerun did not recover.'
    value: ${{ steps.benchmark.outputs.benchmark-false-positives }}
  benchmark-unknown-outcomes:
    description: 'Natural-sample benchmark decisions without an observed real rerun outcome.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-outcomes }}
  benchmark-observed-precision:
    description: 'Natural-sample learned-policy recoveries divided by evaluated decisions.'
    value: ${{ steps.benchmark.outputs.benchmark-observed-precision }}
  benchmark-decision-coverage:
    description: 'Natural-sample learned-policy decisions divided by observed first-attempt failed jobs.'
    value: ${{ steps.benchmark.outputs.benchmark-decision-coverage }}
  benchmark-evaluated-coverage:
    description: 'Natural-sample evaluated learned-policy decisions divided by observed first-attempt failed jobs.'
    value: ${{ steps.benchmark.outputs.benchmark-evaluated-coverage }}
  benchmark-rerun-runs-analyzed:
    description: 'Historical run_attempt > 1 runs analyzed in the rerun-enriched precision sample.'
    value: ${{ steps.benchmark.outputs.benchmark-rerun-runs-analyzed }}
  benchmark-rerun-failed-jobs:
    description: 'First-attempt failed jobs observed inside rerun-enriched runs.'
    value: ${{ steps.benchmark.outputs.benchmark-rerun-failed-jobs }}
  benchmark-rerun-candidates:
    description: 'High-confidence transient rerun candidates with no workflow side-effect signal in the enriched sample.'
    value: ${{ steps.benchmark.outputs.benchmark-rerun-candidates }}
  benchmark-rerun-evaluated:
    description: 'Rerun-enriched candidates with a ground-truth-evaluable outcome: validated recovery or observed failed rerun.'
    value: ${{ steps.benchmark.outputs.benchmark-rerun-evaluated }}
  benchmark-rerun-recoveries:
    description: 'Evaluated rerun-enriched candidates whose recovery was validated by re-execution of the original failed step.'
    value: ${{ steps.benchmark.outputs.benchmark-rerun-recoveries }}
  benchmark-rerun-false-positives:
    description: 'Evaluated rerun-enriched candidates whose real rerun did not recover.'
    value: ${{ steps.benchmark.outputs.benchmark-rerun-false-positives }}
  benchmark-rerun-unknown-outcomes:
    description: 'Rerun-enriched candidates with no real rerun or a later success that could not be ground-truth validated.'
    value: ${{ steps.benchmark.outputs.benchmark-rerun-unknown-outcomes }}
  benchmark-rerun-observed-precision:
    description: 'Rerun-enriched recoveries divided by evaluated candidates, as a decimal from 0 to 1.'
    value: ${{ steps.benchmark.outputs.benchmark-rerun-observed-precision }}
  benchmark-rerun-candidate-coverage:
    description: 'High-confidence transient candidates divided by all first-attempt failures in the rerun-enriched sample.'
    value: ${{ steps.benchmark.outputs.benchmark-rerun-candidate-coverage }}
  benchmark-rerun-blocked:
    description: 'Rerun-enriched failures blocked from becoming safe candidates.'
    value: ${{ steps.benchmark.outputs.benchmark-rerun-blocked }}
  benchmark-rerun-blocked-recovered:
    description: 'Blocked rerun-enriched failures that later recovered after a real rerun.'
    value: ${{ steps.benchmark.outputs.benchmark-rerun-blocked-recovered }}
  benchmark-rerun-blocked-failed-again:
    description: 'Blocked rerun-enriched failures that failed again after a real rerun.'
    value: ${{ steps.benchmark.outputs.benchmark-rerun-blocked-failed-again }}
  benchmark-rerun-blocked-unknown:
    description: 'Blocked rerun-enriched failures without an observable real rerun outcome.'
    value: ${{ steps.benchmark.outputs.benchmark-rerun-blocked-unknown }}
  benchmark-coverage-evidence-gaps:
    description: 'Rerun-enriched failures whose first limiting layer is an evidence gap: classification, causal support, confidence, or execution provenance.'
    value: ${{ steps.benchmark.outputs.benchmark-coverage-evidence-gaps }}
  benchmark-coverage-classification-unknown:
    description: 'Failures whose first limiting layer is UNKNOWN classification.'
    value: ${{ steps.benchmark.outputs.benchmark-coverage-classification-unknown }}
  benchmark-coverage-non-transient:
    description: 'Failures whose first limiting layer is a known category outside the transient allow-list.'
    value: ${{ steps.benchmark.outputs.benchmark-coverage-non-transient }}
  benchmark-coverage-code-regression:
    description: 'Failures whose first limiting layer is deterministic code-regression evidence.'
    value: ${{ steps.benchmark.outputs.benchmark-coverage-code-regression }}
  benchmark-coverage-causal-evidence:
    description: 'Transient failures whose first limiting layer is missing directly causal selected evidence.'
    value: ${{ steps.benchmark.outputs.benchmark-coverage-causal-evidence }}
  benchmark-coverage-low-confidence:
    description: 'Transient failures with causal support whose first limiting layer is insufficient classification confidence.'
    value: ${{ steps.benchmark.outputs.benchmark-coverage-low-confidence }}
  benchmark-coverage-unconfirmed-provenance:
    description: 'High-confidence transient failures whose first limiting layer is unconfirmed execution provenance.'
    value: ${{ steps.benchmark.outputs.benchmark-coverage-unconfirmed-provenance }}
  benchmark-coverage-side-effect-boundary:
    description: 'Evidence-qualified transient failures whose first limiting layer is a workflow or job authority boundary.'
    value: ${{ steps.benchmark.outputs.benchmark-coverage-side-effect-boundary }}
  benchmark-coverage-eligible:
    description: 'Failures that pass all measured coverage-attribution layers and remain eligible rerun candidates.'
    value: ${{ steps.benchmark.outputs.benchmark-coverage-eligible }}
  benchmark-rejection-side-effect:
    description: 'Blocked rerun-enriched failures carrying a workflow or job side-effect risk.'
    value: ${{ steps.benchmark.outputs.benchmark-rejection-side-effect }}
  benchmark-rejection-code-regression:
    description: 'Blocked rerun-enriched failures classified as code regressions.'
    value: ${{ steps.benchmark.outputs.benchmark-rejection-code-regression }}
  benchmark-rejection-low-confidence-transient:
    description: 'Blocked transient-category failures that did not reach high confidence.'
    value: ${{ steps.benchmark.outputs.benchmark-rejection-low-confidence-transient }}
  benchmark-rejection-unconfirmed-provenance:
    description: 'High-confidence transient failures blocked because evidence could not be bound to the failed execution step.'
    value: ${{ steps.benchmark.outputs.benchmark-rejection-unconfirmed-provenance }}
  benchmark-rejection-unknown-classification:
    description: 'Blocked rerun-enriched failures classified as UNKNOWN.'
    value: ${{ steps.benchmark.outputs.benchmark-rejection-unknown-classification }}
  benchmark-rejection-non-transient:
    description: 'Blocked rerun-enriched failures in other non-auto-rerun categories.'
    value: ${{ steps.benchmark.outputs.benchmark-rejection-non-transient }}
  benchmark-unknown-patterns:
    description: 'Distinct UNKNOWN failure signatures found across natural and rerun-enriched benchmark samples.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-patterns }}
  benchmark-unknown-repeated-patterns:
    description: 'UNKNOWN signatures observed at least twice.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-repeated-patterns }}
  benchmark-unknown-evaluated-reruns:
    description: 'UNKNOWN cases with an observed real rerun outcome.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-evaluated-reruns }}
  benchmark-unknown-recoveries:
    description: 'UNKNOWN cases whose observed real rerun recovered.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-recoveries }}
  benchmark-unknown-failed-again:
    description: 'UNKNOWN cases whose observed real rerun failed again.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-failed-again }}
  benchmark-unknown-promotion-candidates:
    description: 'Stable UNKNOWN patterns that meet the conservative investigation threshold for a possible future transient classifier rule.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-promotion-candidates }}
  benchmark-unknown-promotion-candidate-ids:
    description: 'Comma-separated advisory UNKNOWN pattern IDs meeting the investigation threshold.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-promotion-candidate-ids }}
  benchmark-unknown-near-promotion-candidates:
    description: 'UNKNOWN patterns exactly one blocker away from classifier research eligibility.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-near-promotion-candidates }}
  benchmark-unknown-promotion-blocker-no-stable-signature:
    description: 'UNKNOWN patterns blocked because no stable normalized error signature exists.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-promotion-blocker-no-stable-signature }}
  benchmark-unknown-promotion-blocker-insufficient-occurrences:
    description: 'UNKNOWN patterns blocked because fewer than three occurrences are available.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-promotion-blocker-insufficient-occurrences }}
  benchmark-unknown-promotion-blocker-insufficient-gt-reruns:
    description: 'UNKNOWN patterns blocked because fewer than three ground-truth-evaluable reruns are available.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-promotion-blocker-insufficient-gt-reruns }}
  benchmark-unknown-promotion-blocker-recovery-rate-below-threshold:
    description: 'UNKNOWN patterns blocked because validated recovery rate is below 80 percent.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-promotion-blocker-recovery-rate-below-threshold }}
  benchmark-unknown-promotion-blocker-semantic-evidence-quality:
    description: 'UNKNOWN patterns blocked because their signature contains only generic runner wrappers, successful test lines, command-source text, or otherwise lacks specific failure semantics.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-promotion-blocker-semantic-evidence-quality }}
  benchmark-unknown-promotion-blocker-transient-mechanism-evidence:
    description: 'UNKNOWN patterns blocked because no independent transient mechanism such as timeout, reset, DNS failure, 5xx, rate limiting, or temporary unavailability is evidenced.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-promotion-blocker-transient-mechanism-evidence }}
  benchmark-unknown-promotion-blocker-mechanism-causality-evidence:
    description: 'UNKNOWN patterns blocked because transient mechanism tokens were not causally bound inside every ground-truth-evaluable failed-step sample.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-promotion-blocker-mechanism-causality-evidence }}
  benchmark-unknown-promotion-blocker-side-effect-contamination:
    description: 'UNKNOWN patterns blocked because at least one occurrence crossed a workflow side-effect boundary.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-promotion-blocker-side-effect-contamination }}
  benchmark-unknown-promotion-blocker-eligible-for-classifier-research:
    description: 'UNKNOWN patterns satisfying all advisory evidence thresholds for classifier research.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-promotion-blocker-eligible-for-classifier-research }}
  benchmark-unknown-cause-no-stable-error-evidence:
    description: 'UNKNOWN failures with no stable error-like evidence after semantic filtering.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-cause-no-stable-error-evidence }}
  benchmark-unknown-cause-auth-permission:
    description: 'UNKNOWN failures diagnostically grouped as authentication or permission errors.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-cause-auth-permission }}
  benchmark-unknown-cause-git-vcs:
    description: 'UNKNOWN failures diagnostically grouped as Git or version-control errors.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-cause-git-vcs }}
  benchmark-unknown-cause-command-config:
    description: 'UNKNOWN failures diagnostically grouped as command, argument, file, or configuration errors.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-cause-command-config }}
  benchmark-unknown-cause-test-build:
    description: 'UNKNOWN failures diagnostically grouped as test or build errors.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-cause-test-build }}
  benchmark-unknown-cause-package-tool:
    description: 'UNKNOWN failures diagnostically grouped as package-manager or dependency-tool errors.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-cause-package-tool }}
  benchmark-unknown-cause-tool-action-specific:
    description: 'UNKNOWN failures diagnostically grouped as errors from recognized CI/deployment/developer tools.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-cause-tool-action-specific }}
  benchmark-unknown-cause-ambiguous-operational:
    description: 'UNKNOWN failures with stable operational error evidence that does not match another diagnostic cause family.'
    value: ${{ steps.benchmark.outputs.benchmark-unknown-cause-ambiguous-operational }}

runs:
  using: 'composite'
  steps:
    - name: Validate rerun mode
      if: ${{ inputs.auto-rerun == 'true' && inputs.selective-rerun == 'true' }}
      shell: bash
      run: |
        echo "::error::auto-rerun and selective-rerun cannot both be true"
        exit 2

    - id: gate
      name: Assess retry safety
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_RUN_ID: ${{ inputs.run-id }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_AUTO_RERUN: ${{ inputs.auto-rerun }}
        INPUT_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
      run: python3 "$GITHUB_ACTION_PATH/ci_retry_gate.py"

    - id: selective
      name: Selectively rerun safe failed jobs
      if: ${{ inputs.selective-rerun == 'true' }}
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_RUN_ID: ${{ inputs.run-id }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_MAX_ATTEMPTS: ${{ inputs.max-attempts }}
      run: python3 "$GITHUB_ACTION_PATH/selective_rerun.py"

    - id: history
      name: Analyze CI history, fingerprints, policies, and waste
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_RUN_ID: ${{ inputs.run-id }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_HISTORY_RUNS: ${{ inputs.history-runs }}
      run: python3 "$GITHUB_ACTION_PATH/history_ci_waste.py"

    - id: shadow
      name: Backtest learned policies in shadow mode
      if: ${{ inputs.policy-shadow-mode == 'true' }}
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_RUN_ID: ${{ inputs.run-id }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_HISTORY_RUNS: ${{ inputs.history-runs }}
      run: python3 "$GITHUB_ACTION_PATH/policy_shadow.py"

    - id: benchmark
      name: Benchmark learned retry policies across repositories
      if: ${{ inputs.benchmark-mode == 'true' }}
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_REPOSITORY: ${{ inputs.repository }}
        INPUT_BENCHMARK_REPOSITORIES: ${{ inputs.benchmark-repositories }}
        INPUT_BENCHMARK_RUNS: ${{ inputs.benchmark-runs }}
        INPUT_BENCHMARK_RERUN_RUNS: ${{ inputs.benchmark-rerun-runs }}
        INPUT_BENCHMARK_RERUN_SEARCH_RUNS: ${{ inputs.benchmark-rerun-search-runs }}
      run: python3 "$GITHUB_ACTION_PATH/benchmark_mode.py"

branding:
  icon: 'shield'
  color: 'blue'
