[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-failure-lab"
version = "0.1.0"
description = "Analyze one failed workflow execution and print a Markdown incident report."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
