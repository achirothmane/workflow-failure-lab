[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow-failure-lab"
version = "1.0.1"
description = "Conservative GitHub Actions retry safety gate with provenance, history, selective reruns, and benchmark diagnostics."
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
